name: QA motor vial para recogidas
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/qa-public-road-routing.yml']
    branches: [main]
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar rutas verificadas sin GPS del conductor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,urllib.error
          base="https://traslados-web.marcelof-gx.workers.dev/api/public/route-estimate"
          cases=[
            ("Carrasco-CiudadVieja","-56.01638,-34.83696;-56.207,-34.906"),
            ("Centro-PuntaCarretas","-56.165,-34.902;-56.159,-34.926"),
          ]
          for name,points in cases:
            url=base+"?"+urllib.parse.urlencode({"points":points})
            req=urllib.request.Request(url,headers={"Accept":"application/json"})
            try:
              with urllib.request.urlopen(req,timeout=18) as r:
                body=json.load(r);print(name,"HTTP",r.status, {k:body.get(k) for k in ("available","source","reason","distanceKm","durationMin")})
            except urllib.error.HTTPError as e:
              try: body=json.loads(e.read().decode())
              except: body={}
              print(name,"HTTP",e.code, {k:body.get(k) for k in ("available","source","reason","distanceKm","durationMin")})
            except Exception as ex:
              print(name,"NETWORK_ERROR",str(ex)[:160])
          PY
