name: QA ETA publico por zona sin exponer GPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/smoke-pickup-eta-v2.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verificar ETA para invitado desde web oficial
        shell: bash
        run: |
          set -euo pipefail
          API_KEY="$(grep -o 'sb_publishable_[^"]*' web-pasajero/app.js | head -1)"
          test -n "$API_KEY"
          status="$(curl -sS --max-time 20 -o /tmp/eta.json -w '%{http_code}' \
            'https://zetaudvvutlouiqxopvg.supabase.co/functions/v1/pickup-eta' \
            -H 'Origin: https://marcelofgx-ctrl.github.io' \
            -H 'Content-Type: application/json' -H "apikey: $API_KEY" \
            --data '{"originLat":-34.833,"originLng":-56.028}')"
          echo "Estado HTTP respuesta anonima: $status"
          test "$status" = 200 -o "$status" = 429
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/eta.json'))
          assert r.get('reason') not in ('login_required','invalid_request','forbidden'),r.get('reason')
          assert not any(k in r for k in ('driverLat','driverLng','coarseDriverLat','coarseDriverLng','lat','lng')), 'GPS se expuso al cliente'
          if r.get('available'):
              assert isinstance(r.get('distanceKm'),(int,float)) and r['distanceKm']>0
              assert isinstance(r.get('etaMin'),(int,float)) and r['etaMin']>=0
              assert r.get('approximate') is True and r.get('confirmationRequired') is True
              assert r.get('estimateType')=='coarse'
              print('PASS: ETA anonimo km/min por zona, sin coordenadas')
          else:
              print('PASS: servidor bloquea ETA sin disponibilidad verificable, motivo:',r.get('reason'))
          PY
      - name: Bloquear visitante de origen no autorizado
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 15 -o /tmp/forbidden.json -w '%{http_code}' \
            'https://zetaudvvutlouiqxopvg.supabase.co/functions/v1/pickup-eta' \
            -H 'Origin: https://unauthorized.example' \
            -H 'Content-Type: application/json' \
            --data '{"originLat":-34.833,"originLng":-56.028}')"
          test "$code" = 403
          echo 'PASS: origen externo no autorizado'
