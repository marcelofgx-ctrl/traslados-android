name: Quick Trip v85 - Probar proveedores de enlace QA sin publicar
on:
  push:
    branches:
      - qa/quicktrip-v85-samsung-link-readonly-20261024
    paths:
      - .github/workflows/quicktrip-v85-alt-preview-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-static-mirrors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probar MIME y SHA del HTML QA en 4 CDN independientes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,hashlib,os
          sha=os.environ['GITHUB_SHA']
          root='marcelofgx-ctrl/traslados-android/'+sha+'/web-pasajero/'
          candidates=[
            'https://rawcdn.githack.com/'+root+'index.html',
            'https://rawgit.hack/'+root+'index.html',
            'https://rawgit.net/'+root+'index.html',
            'https://cdn.statically.io/gh/marcelofgx-ctrl/traslados-android/'+sha+'/web-pasajero/index.html'
          ]
          expected=open('web-pasajero/index.html','rb').read()
          for url in candidates:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'QuickTrip-QA-Link-Check/1.0'})
              with urllib.request.urlopen(req,timeout=15) as resp:
                data=resp.read(180000)
                print('CANDIDATE',url,'STATUS',resp.status,'MIME',resp.headers.get('Content-Type'),'BYTES',len(data),'EXACT',data==expected,flush=True)
            except Exception as exc: print('CANDIDATE',url,'FAIL',str(exc)[:240],flush=True)
          PY
