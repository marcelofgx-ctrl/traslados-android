name: Mapa Trayectos — Visual QA Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'mapatrayectos/**'
      - '.github/workflows/qa-mapa-visual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - name: Reproducir recursos originales
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mapatrayectos/src/main/assets mapatrayectos/src/main/res/raw mapatrayectos/src/main/res/drawable-nodpi
          base64 -d mapatrayectos/assets/manrope.ttf.base64 > mapatrayectos/src/main/assets/manrope.ttf
          base64 -d mapatrayectos/assets/reminder_bubbles_elevenlabs.mp3.base64 > mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3
          base64 -d mapatrayectos/assets/logo_c_avatar.jpg.base64 > mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg
          test -s mapatrayectos/src/main/assets/manrope.ttf
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android del runner (sin setup-android obsoleto)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de previsualización
        shell: bash
        run: gradle :mapatrayectos:assembleDebug --stacktrace
      - name: Preparar detector de overlays para QA
        run: python3 -m pip -q install pillow
      - name: Preparar aceleración de hardware del emulador
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; fi
          df -h /tmp
      - name: Capturas Android (inicio y jornada activa)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/mapa-visual-capture.sh
      - name: Inspección geométrica y visual de capturas
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageStat,ImageChops
          from pathlib import Path
          files=[Path('docs/visual-qa/mapa-preview-'+x+'.png') for x in ('idle','shift-active','shift-close-expanded')]
          images=[]
          for p in files:
              im=Image.open(p).convert('RGB')
              w,h=im.size
              assert w>=700 and h>=1400,(p,w,h)
              # The R25.19 VECTOR MAP is intentionally light. Only the cockpit,
              # not the cartography, must remain dark: reject washed-out HUD.
              header=im.crop((int(w*.12),int(h*.045),int(w*.85),int(h*.12)))
              hud=sum(ImageStat.Stat(header).mean)/3
              assert hud<155,(p,'cockpit lost its petroleum contrast',hud)
              map_window=im.crop((int(w*.2),int(h*.38),int(w*.8),int(h*.60)))
              map_mean=sum(ImageStat.Stat(map_window).mean)/3
              assert map_mean>135,(p,'light map is missing or tiles did not load',map_mean)
              assert map_mean>hud+45,(p,'insufficient contrast between map and HUD',map_mean,hud)
              print('Daylight map:',round(map_mean,1),'Petroleum HUD:',round(hud,1))
              # The script checks Android view hierarchy for actual system modals.
              # Never reject a legitimate bright map road/vehicle pixel.
              images.append(im)
              print(p,w,h)
          diff=ImageChops.difference(images[0],images[1]).convert('L')
          strong=sum(diff.histogram()[36:])/(diff.width*diff.height)
          print('Strong pixel difference:',round(strong*100,2),'%')
          assert strong>0.008,'Jornada sin transición visual apreciable'
          expanded=ImageChops.difference(images[1],images[2]).convert('L')
          expanded_ratio=sum(expanded.histogram()[35:])/(expanded.width*expanded.height)
          print('Circular expansion pixel difference:',round(expanded_ratio*100,2),'%')
          assert expanded_ratio>0.004,'El círculo no produjo cambio visual suficiente'
          PY
      - name: Guardar capturas de previsualización (incluso si falla QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-mapa-preview
          path: |
            docs/visual-qa/mapa-preview-*.png
            docs/visual-qa/*ui.xml
            docs/visual-qa/last-window.xml
            docs/visual-qa/fatal-log.txt
            docs/visual-qa/state-after-start.xml
            docs/visual-qa/state-after-orb.xml
          if-no-files-found: warn
