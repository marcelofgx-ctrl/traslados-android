name: Verify modular Mapa and reservations core
on:
  pull_request:
    paths:
      - 'core-reservations/**'
      - 'mapatrayectos/**'
      - 'conductor/src/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/validate-modular-mapa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9 reusable cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Standalone reservation rules regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/traslados-core-test
          javac -d /tmp/traslados-core-test \
            core-reservations/src/main/java/uy/com/mapatrayectos/QuickReservationLogic.java \
            mapatrayectos/tests/QuickReservationLogicTest.java
          java -cp /tmp/traslados-core-test QuickReservationLogicTest
      - name: Prepare existing Mapa offline assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mapatrayectos/src/main/res/drawable-nodpi mapatrayectos/src/main/res/raw
          base64 --decode mapatrayectos/assets/logo_c_avatar.jpg.base64 \
            > mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg
          base64 --decode mapatrayectos/assets/reminder_bubbles_elevenlabs.mp3.base64 \
            > mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3
      - name: Verify Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate core build and native Mapa integration
        shell: bash
        run: |
          # Mantiene la misma compilación DEBUG. La telemetría nunca firma
          # ni reemplaza las APK RELEASE que usan los pasajeros y conductor.
          set -uo pipefail
          started=$SECONDS
          gradle :core-reservations:classes :mapatrayectos:assembleDebug \
            --build-cache --stacktrace --no-daemon --console=plain --profile \
            2>&1 | tee "$RUNNER_TEMP/mapa-gradle-build.log"
          result=${PIPESTATUS[0]}
          echo "GRADLE_BUILD_SECONDS=$((SECONDS-started))" >> "$GITHUB_ENV"
          echo "GRADLE_BUILD_EXIT=$result" >> "$GITHUB_ENV"
          exit "$result"
      - name: Summarize Gradle build duration and cache reuse
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/mapa-gradle-build.log"
          {
            echo "### Mapa modular — compilación de validación"
            echo ""
            echo "| Indicador | Resultado |"
            echo "|---|---|"
            echo "| Tipo de build | DEBUG sin firma ni publicación |"
            echo "| Tiempo de Gradle | ${GRADLE_BUILD_SECONDS:-no medido} s |"
            echo "| Código de salida | ${GRADLE_BUILD_EXIT:-no disponible} |"
            if [ -s "$log" ]; then
              total="$(grep -c '^> Task ' "$log" || true)"
              reused="$(grep -c ' FROM-CACHE' "$log" || true)"
              uptodate="$(grep -c ' UP-TO-DATE' "$log" || true)"
              echo "| Tareas informadas | $total |"
              echo "| Desde caché | $reused |"
              echo "| Sin cambios (UP-TO-DATE) | $uptodate |"
            fi
            echo ""
            echo "La duración total de GitHub Actions incluye preparación del SDK y checkout; no debe confundirse con Gradle ni con una compilación incremental local."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain short-lived Gradle performance profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapa-modular-gradle-profile
          path: |
            build/reports/profile/*.html
            mapatrayectos/build/reports/profile/*.html
          if-no-files-found: warn
          retention-days: 7
