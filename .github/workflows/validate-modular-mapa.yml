name: Verify modular Mapa and reservations core
on:
  pull_request:
    paths:
      - 'core-reservations/**'
      - 'mapatrayectos/**'
      - 'conductor/src/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/validate-modular-mapa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9 reusable cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Standalone reservation rules regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/traslados-core-test
          javac -d /tmp/traslados-core-test \
            core-reservations/src/main/java/uy/com/mapatrayectos/QuickReservationLogic.java \
            mapatrayectos/tests/QuickReservationLogicTest.java
          java -cp /tmp/traslados-core-test QuickReservationLogicTest
      - name: Prepare existing Mapa offline assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mapatrayectos/src/main/res/drawable-nodpi mapatrayectos/src/main/res/raw
          base64 --decode mapatrayectos/assets/logo_c_avatar.jpg.base64 \
            > mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg
          base64 --decode mapatrayectos/assets/reminder_bubbles_elevenlabs.mp3.base64 \
            > mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3
      - name: Verify Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate core build and native Mapa integration
        shell: bash
        run: |
          set -euo pipefail
          gradle :core-reservations:classes :mapatrayectos:assembleDebug \
            --build-cache --stacktrace --no-daemon
