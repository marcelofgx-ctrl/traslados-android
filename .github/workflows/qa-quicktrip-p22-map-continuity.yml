name: QA Quick Trip P2.2 — continuity map while GPS pending (NO DEPLOY)
on:
  push:
    branches:
      - qa/quicktrip-p22-map-continuity-20261101
permissions:
  contents: read
jobs:
  map-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify QA source-lineage and exact file allowlist
        shell: bash
        run: |
          set -euo pipefail
          BASE=330f15bc09bfccdbd7b592831fea17b55bcc0ffb
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          mapfile -t files < <(git diff --name-only "$BASE"..HEAD | LC_ALL=C sort)
          test "${#files[@]}" -eq 6
          for file in "${files[@]}"; do
            case "$file" in
              .github/workflows/qa-quicktrip-p22-map-continuity.yml|web-pasajero/reservation-live.js|web-pasajero/index.html|web-pasajero/sw.js|scripts/qa_quicktrip_tracking_metrics_browser.cjs|tests/quicktrip-p22-map-continuity-contract.cjs) ;;
              *) echo "FAIL unauthorized scope $file"; exit 1 ;;
            esac
          done
          git diff --quiet "$BASE"..HEAD -- mapatrayectos/ conductor/ core-reservations/ supabase/ web-pasajero/app.js web-pasajero/route-engine.js web-pasajero/eta-engine.js web-pasajero/premium-map.js web-pasajero/quicktrip-map-focus.js web-pasajero/quicktrip-p18-fare-flow-icons.css vercel.json
          echo "PASS: no GPS, ETA, prices, booking, Android or production changes"
      - name: Check source contracts for GPS, fallback map and booking
        shell: bash
        run: |
          set -euo pipefail
          node --check web-pasajero/reservation-live.js
          node --check scripts/qa_quicktrip_tracking_metrics_browser.cjs
          node tests/quicktrip-p22-map-continuity-contract.cjs
          node tests/quicktrip-p20-pickup-activation-contract.cjs
          node tests/quicktrip-tracking-metrics-contract.cjs
          node web-pasajero/tests/tracking-fases-gps-real-smoke.cjs
          node web-pasajero/tests/reservation-live-v82-smoke.cjs
      - name: Chromium QA screenshot and phase transition regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa_quicktrip_tracking_metrics_browser.cjs
      - name: Attach QA screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quicktrip-p22-map-continuity-evidence
          path: artifacts/quicktrip-tracking-metrics/
          retention-days: 14
          if-no-files-found: warn
