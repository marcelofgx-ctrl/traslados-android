name: Bootstrap Conductor R10.3 UI

on:
  push:
    branches:
      - 'feature/conductor-r10.3-ui'
    paths:
      - '.github/workflows/r10.3-ui-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/conductor-r10.3-ui
          fetch-depth: 0

      - name: Apply deterministic R10.3 patch
        run: python3 .github/scripts/patch_r10_3.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify R10.3 markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 121" conductor/build.gradle
          grep -q "versionName '11.4-R10.3'" conductor/build.gradle
          grep -q 'Conductor v11.4 R10.3 iniciado' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'agendaStatusMode' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'gpsStateChip' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'activeSyncInFlight' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'v11.4 · R10.3 · build 121' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q '11.4-R10.3' conductor/src/main/java/uy/com/traslados/conductor/Api.java
          test -f conductor/src/main/res/drawable/ic_refresh.xml
          test -f conductor/src/main/res/drawable/ic_gps.xml

      - name: Build R10.3
        run: gradle :conductor:assembleDebug --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor_v11.4_R10.3.apk
          sha256sum artifacts/Traslados_Conductor_v11.4_R10.3.apk | tee artifacts/SHA256SUMS.txt

      - name: Commit generated source after green build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add conductor .github/workflows/build-conductor-source.yml
          git commit -m 'Implement Conductor v11.4 R10.3 visual UI [r10.3-generated]'
          git push origin HEAD:feature/conductor-r10.3-ui

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-R10.3-UI
          path: |
            artifacts/Traslados_Conductor_v11.4_R10.3.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
