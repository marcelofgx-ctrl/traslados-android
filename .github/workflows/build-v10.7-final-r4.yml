      - name: Set v10.7 versions and normalize client headers
        shell: bash
        run: |
          python3 - <<'PYVERSION'
          from pathlib import Path
          import re

          for module in ('cliente','conductor'):
              p=Path(module)/'build.gradle'
              s=p.read_text()
              s=re.sub(r'versionCode\s+\d+', 'versionCode 107', s, count=1)
              s=re.sub(r"versionName\s+'[^']+'", "versionName '10.7'", s, count=1)
              p.write_text(s)

          p=Path('cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java')
          s=p.read_text(); s=re.sub(r'Cliente v\d+(?:\.\d+)+ iniciado','Cliente v10.7 iniciado',s); p.write_text(s)
          p=Path('conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java')
          s=p.read_text(); s=re.sub(r'Conductor v\d+(?:\.\d+)+ iniciado','Conductor v10.7 iniciado',s); s=re.sub(r'VERSIÓN\s+\d+(?:\.\d+)+','V10.7',s); p.write_text(s)

          p=Path('cliente/src/main/java/uy/com/traslados/cliente/Api.java')
          s=p.read_text(); s=re.sub(r'TrasladosConReserva/\d+(?:\.\d+)+','TrasladosConReserva/10.7',s); s=re.sub(r'b\.put\("p_app_version","[^"]+"\)', 'b.put("p_app_version","10.7")', s); p.write_text(s)
          p=Path('conductor/src/main/java/uy/com/traslados/conductor/Api.java')
          s=p.read_text(); s=re.sub(r'traslados-conductor-android/\d+(?:\.\d+)+','traslados-conductor-android/10.7',s); s=re.sub(r'b\.put\("p_app_version","[^"]+"\)', 'b.put("p_app_version","10.7")', s); p.write_text(s)
          PYVERSION

      - name: Verify v10.7 FINAL source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '10.7'" cliente/build.gradle
          grep -q "versionName '10.7'" conductor/build.gradle
          grep -q 'customer_create_reservation_v10' cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q 'customer_quote_decision_v10' cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q 'routeEstimate' cliente/src/main/java/uy/com/traslados/cliente/Api.java
          grep -q 'PREPARAR PRESUPUESTO' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'agendaMode' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q '📅 FECHA' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'agendaCustomDate' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'V10.7' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'driver_send_quote_v10' conductor/src/main/java/uy/com/traslados/conductor/Api.java
          grep -q 'driver_send_quote_v10_7' conductor/src/main/java/uy/com/traslados/conductor/Api.java
          grep -q 'driver_get_quote_settings_v10_7' conductor/src/main/java/uy/com/traslados/conductor/Api.java
          grep -q 'driver_set_default_toll_v10_7' conductor/src/main/java/uy/com/traslados/conductor/Api.java
          grep -q 'quote_toll_count' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'NOVEDAD ' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'driverBubbleConsumeSelfChange' conductor/src/main/java/uy/com/traslados/conductor/ReservationMonitorService.java
          grep -q 'traslados_nuevas_v107' conductor/src/main/java/uy/com/traslados/conductor/ReservationMonitorService.java
          grep -q 'VibrationEffect.createOneShot(170' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'El conductor inició el viaje' cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q 'El conductor inició el viaje' cliente/src/main/java/uy/com/traslados/cliente/CustomerBubbleService.java
          grep -q 'dp(72)+bottom' cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q '〰 ' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'CUSTOMER_REFRESH_MS=12000L' cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
