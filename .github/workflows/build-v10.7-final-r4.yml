      - name: Build Cliente and Conductor v10.7 FINAL
        run: gradle :cliente:assembleDebug :conductor:assembleDebug --stacktrace

      - name: Prepare APKs
        shell: bash
        run: |
          mkdir -p artifacts
          cp cliente/build/outputs/apk/debug/cliente-debug.apk artifacts/Traslados_Cliente_v10.7.apk
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor_v10.7.apk
          sha256sum artifacts/*.apk
          ls -lh artifacts

      - name: Upload Cliente v10.7 APK
        uses: actions/upload-artifact@v4
        with:
