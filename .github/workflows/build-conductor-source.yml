# ACTUALIZADO: 2026-10-09
# FUENTE DE VERDAD: proyecto Android versionado en GitHub
# No reconstruye desde YAML históricos ni artifacts previos.

name: Build Traslados Conductor from source DEBUG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'conductor/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-conductor-source.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify current canonical source
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f conductor/build.gradle
          test -f conductor/src/main/AndroidManifest.xml
          D=conductor/src/main/java/uy/com/traslados/conductor
          for cls in MainActivity Api ReservationMonitorService TripTelemetryService DemandMapActivity; do
            test -s "$D/$cls.java"
          done
          test -s conductor/src/main/res/raw/reserva_calida.wav
          test -s conductor/src/main/res/raw/viaje_proximo.wav
          test -s conductor/src/main/res/drawable-nodpi/app_icon.png
          grep -q "applicationId 'uy.com.traslados.conductor'" conductor/build.gradle
          grep -q "versionName '11.5-R1'" conductor/build.gradle
          grep -q 'versionCode 123' conductor/build.gradle
          grep -q 'org.maplibre.gl:android-sdk:13.6.1' conductor/build.gradle
          grep -q 'DemandMapActivity' conductor/src/main/AndroidManifest.xml
          grep -q 'showKeyboardSafeQuoteDialog' "$D/MainActivity.java"
          echo 'Código fuente Conductor 11.5-R1 comprobado (incluye corrección de teclado R24.3)'

      - name: Build Traslados Conductor DEBUG from repository source
        run: gradle :conductor:assembleDebug --stacktrace --no-daemon

      - name: Prepare DEBUG artifact and traceability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor_v11.5_R1_DEBUG.apk
          sha256sum artifacts/*.apk | tee artifacts/SHA256SUMS.txt
          printf 'Source commit: %s\nBuild type: DEBUG (NO reemplaza una APK RELEASE)\nModule: conductor/\nVersion: 11.5-R1 / code 123\n' "$GITHUB_SHA" > artifacts/BUILD_INFO.txt
          ls -lh artifacts/

      - name: Upload DEBUG APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v11.5-R1-DEBUG-SOURCE
          path: artifacts/
          if-no-files-found: error
