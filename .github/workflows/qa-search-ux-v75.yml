name: QA Uruguay address autocomplete V75
on:
  push:
    branches: [fix/uruguay-search-autocomplete-20261016]
    paths:
      - 'web-pasajero/**'
      - '.github/workflows/qa-search-ux-v75.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search, 0-0 official street, API fallback, visual and all public passenger regressions
        run: |
          set -euo pipefail
          node --check web-pasajero/address-engine.js
          node --check web-pasajero/app.js
          node --check web-pasajero/geo-search.js
          node --check web-pasajero/sw.js
