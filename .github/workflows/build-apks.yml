      - name: Build Cliente v8
        run: gradle :cliente:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp cliente/build/outputs/apk/debug/cliente-debug.apk artifacts/Traslados_Cliente_v8.apk
          ls -lh artifacts/Traslados_Cliente_v8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Cliente-v8
          path: artifacts/Traslados_Cliente_v8.apk
          if-no-files-found: error
