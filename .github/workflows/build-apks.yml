# VERSION: build-apks-v7-fix-aceptar-robusto

name: Build Traslados APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore known-good Android project
        shell: bash
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/c059c89bac5a5ebb423176af474134a289f88418/.github/workflows/build-apks.yml" \
            -o /tmp/v4.yml

          python3 - <<'PY'
          import base64, io, re, tarfile
          txt = open("/tmp/v4.yml", encoding="utf-8").read()
          m = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| tar -xz", txt)
          if not m:
              raise SystemExit("No se encontró el proyecto Android base v4")
          data = base64.b64decode(m.group(1), validate=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tf:
              tf.extractall(".")
          PY

      - name: Fix Conductor status request
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("conductor/src/main/java/uy/com/traslados/conductor/Api.java")
          s = p.read_text()

          prefer = '        if("PATCH".equals(method)) c.setRequestProperty("Prefer","return=representation");'
          anchor = '        if(body!=null){'

          if prefer not in s:
              raise SystemExit("No se encontró la línea Prefer en Api.java")
          if anchor not in s:
              raise SystemExit("No se encontró el bloque body en Api.java")

          s = s.replace(prefer, '', 1)
          s = s.replace(anchor, prefer + "\n" + anchor, 1)
          p.write_text(s)
          print("Api.java corregido")
          PY

      - name: Build both APKs
        run: gradle :cliente:assembleDebug :conductor:assembleDebug --stacktrace

      - name: Prepare APK files
        run: |
          mkdir -p artifacts
          cp cliente/build/outputs/apk/debug/cliente-debug.apk artifacts/Traslados_Cliente.apk
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor.apk
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-APKs-v7
          path: artifacts/*.apk
          if-no-files-found: error
