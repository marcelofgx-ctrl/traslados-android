      - name: Build Conductor v8
        run: gradle :conductor:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor_v8.apk
          ls -lh artifacts/Traslados_Conductor_v8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v8
          path: artifacts/Traslados_Conductor_v8.apk
          if-no-files-found: error
