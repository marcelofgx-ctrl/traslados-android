name: Build Traslados APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        shell: bash
        run: |
          echo '' | base64 -d | tar -xz

      - name: Build both APKs
        run: gradle :cliente:assembleDebug :conductor:assembleDebug --stacktrace

      - name: Prepare APK files
        run: |
          mkdir -p artifacts
          cp cliente/build/outputs/apk/debug/cliente-debug.apk artifacts/Traslados_Cliente.apk
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor.apk
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-APKs
          path: artifacts/*.apk
          if-no-files-found: error
