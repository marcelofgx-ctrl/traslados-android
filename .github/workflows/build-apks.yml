      - name: Verify Cliente v8.3
        shell: bash
        run: |
          grep -q "versionName '8.3'" cliente/build.gradle
          grep -q "¡Reserva enviada!" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q "log_app_event" cliente/src/main/java/uy/com/traslados/cliente/Api.java
          grep -q "USAR ESTA UBICACIÓN" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          test -f cliente/src/main/res/drawable-nodpi/header_client.jpg
          test -f cliente/src/main/res/drawable-nodpi/bg_texture.png
          test -f cliente/src/main/res/drawable-nodpi/app_icon.jpg
          echo "Cliente v8.3 verificado correctamente"

      - name: Build Cliente v8.3
        run: |
          gradle :cliente:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp cliente/build/outputs/apk/debug/cliente-debug.apk artifacts/Traslados_Cliente_v8.3.apk
          ls -lh artifacts/Traslados_Cliente_v8.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Cliente-v8.3
          path: artifacts/Traslados_Cliente_v8.3.apk
          if-no-files-found: error
