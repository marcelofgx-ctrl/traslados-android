      - name: Verify Cliente v9.0
        shell: bash
        run: |
          grep -q "versionName '9.0'" cliente/build.gradle
          grep -q "customer_create_reservation" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q "Datos personales" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q "Mis reservas" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q "MIS RESERVAS" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q "customer_cancel_reservation" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q "tracked_json" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q "log_app_event" cliente/src/main/java/uy/com/traslados/cliente/Api.java
          test -f cliente/src/main/res/drawable-nodpi/header_client.jpg
          test -f cliente/src/main/res/drawable-nodpi/bg_texture.png
          test -f cliente/src/main/res/drawable-nodpi/app_icon.jpg
          echo "Cliente v9.0 verificado correctamente"

      - name: Build Cliente v9.0
        run: |
          gradle :cliente:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp cliente/build/outputs/apk/debug/cliente-debug.apk artifacts/Traslados_Cliente_v9.0.apk
          ls -lh artifacts/Traslados_Cliente_v9.0.apk

      - name: Upload APK
