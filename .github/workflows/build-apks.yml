      - name: Verify Cliente v8.4
        shell: bash
        run: |
          grep -q "versionName '8.4'" cliente/build.gradle
          grep -q "MIS RESERVAS" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q "cancel_reservation_by_token" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q "tracked_json" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q "log_app_event" cliente/src/main/java/uy/com/traslados/cliente/Api.java
          test -f cliente/src/main/res/drawable-nodpi/header_client.jpg
          test -f cliente/src/main/res/drawable-nodpi/bg_texture.png
          test -f cliente/src/main/res/drawable-nodpi/app_icon.jpg
          echo "Cliente v8.4 verificado correctamente"

      - name: Build Cliente v8.4
        run: |
          gradle :cliente:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp cliente/build/outputs/apk/debug/cliente-debug.apk artifacts/Traslados_Cliente_v8.4.apk
          ls -lh artifacts/Traslados_Cliente_v8.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Cliente-v8.4
          path: artifacts/Traslados_Cliente_v8.4.apk
          if-no-files-found: error
