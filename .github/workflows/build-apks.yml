# VERSION: build-cliente-v8-premium-ui-short

name: Build Traslados Cliente v8

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android base
        shell: bash
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/c059c89bac5a5ebb423176af474134a289f88418/.github/workflows/build-apks.yml" \
            -o /tmp/base-v4.yml

          python3 - <<'PY'
          import base64
          import io
          import re
          import tarfile

          txt = open("/tmp/base-v4.yml", encoding="utf-8").read()

          m = re.search(
              r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| tar -xz",
              txt
          )

          if not m:
              raise SystemExit("No se encontró el proyecto Android base")

          data = base64.b64decode(m.group(1), validate=True)

          with tarfile.open(
              fileobj=io.BytesIO(data),
              mode="r:gz"
          ) as tf:
              tf.extractall(".")
          PY

      - name: Download Cliente v8 premium package
        shell: bash
        run: |
          curl --retry 3 --retry-delay 2 -fsSL \
            -H "apikey: sb_publishable_hIAdKpf7t8N6wGNfVC__OA_1oLRGR5U" \
            -H "Authorization: Bearer sb_publishable_hIAdKpf7t8N6wGNfVC__OA_1oLRGR5U" \
            "https://c--37e5ea75-667b-4c05-b55b-52dddb9e82f3-prod.lovable.cloud/rest/v1/build_assets?name=eq.cliente-v8-overlay&select=content_base64" \
            -o /tmp/cliente-v8.json

          python3 - <<'PY'
          import base64
          import json

          with open("/tmp/cliente-v8.json", encoding="utf-8") as f:
              rows = json.load(f)

          if not rows:
              raise SystemExit("No se encontró el paquete Cliente v8")

          payload = rows[0]["content_base64"]

          data = base64.b64decode(payload, validate=True)

          with open("/tmp/cliente-v8-overlay.tgz", "wb") as f:
              f.write(data)

          print("Paquete Cliente v8 descargado:", len(data), "bytes")
          PY

          tar -xzf /tmp/cliente-v8-overlay.tgz

      - name: Verify Cliente v8
        shell: bash
        run: |
          grep -q "versionName '8.3'" cliente/build.gradle
          grep -q "¡Reserva enviada!" cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q "log_app_event" cliente/src/main/java/uy/com/traslados/cliente/Api.java

          test -f cliente/src/main/res/drawable-nodpi/header_client.jpg
          test -f cliente/src/main/res/drawable-nodpi/bg_texture.png
          test -f cliente/src/main/res/drawable-nodpi/app_icon.jpg

          echo "Cliente v8 verificado correctamente"

      - name: Build Cliente v8
        run: |
          gradle :cliente:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p artifacts

          cp \
            cliente/build/outputs/apk/debug/cliente-debug.apk \
            artifacts/Traslados_Cliente_v8.apk

          ls -lh artifacts/Traslados_Cliente_v8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Cliente-v8
          path: artifacts/Traslados_Cliente_v8.apk
          if-no-files-found: error
