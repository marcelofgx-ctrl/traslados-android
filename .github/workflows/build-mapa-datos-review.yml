name: Mapa Datos R25.26 review — no public deployment
on:
  push:
    branches:
      - feature/mapa-datos-sin-borrado-20261017
    paths:
      - 'mapatrayectos/**'
      - 'conductor/**'
      - 'core-reservations/**'
      - 'scripts/test_mapa_datos.py'
      - '.github/workflows/build-mapa-datos-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mapa-data-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install original assets (same checksum as production)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mapatrayectos/src/main/res/drawable-nodpi mapatrayectos/src/main/res/raw mapatrayectos/src/main/assets
          base64 -d mapatrayectos/assets/logo_c_avatar.jpg.base64 > mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg
          base64 -d mapatrayectos/assets/reminder_bubbles_elevenlabs.mp3.base64 > mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3
          base64 -d mapatrayectos/assets/manrope.ttf.base64 > mapatrayectos/src/main/assets/manrope.ttf
          echo "a71f22c701189b3f0ef90a5405a285246e3d8ab80ffe2a528e01b19273737c15  mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg" | sha256sum -c
          echo "5cc7d452cb5f265bf6544486c52f3e8b57d3a292e77af38cbb5e3df0e9875bb0  mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3" | sha256sum -c
          test "$(git hash-object mapatrayectos/src/main/assets/manrope.ttf)" = '75274da58537d6123b14f2cd0c355ad4681fc2b3'
      - name: Test data policy + no remote deletion
        run: python3 scripts/test_mapa_datos.py
      - name: Isolate review APK from published app
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/applicationId 'uy.com.mapatrayectos'/applicationId 'uy.com.mapatrayectos.datosreview'/" mapatrayectos/build.gradle
          sed -i "s/versionCode 77/versionCode 78/" mapatrayectos/build.gradle
          sed -i "s/versionName '0.1-R25.25'/versionName '0.1-R25.26-DATOS-REVIEW'/" mapatrayectos/build.gradle
          grep -q "applicationId 'uy.com.mapatrayectos.datosreview'" mapatrayectos/build.gradle
      - name: Compile independent Android debug APK
        run: gradle :mapatrayectos:assembleDebug --stacktrace
      - name: Validate installed package and APK integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=mapatrayectos/build/outputs/apk/debug/mapatrayectos-debug.apk
          test -s "$APK"
          AAPT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='uy.com.mapatrayectos.datosreview'" apk-badging.txt
          mkdir -p artifacts
          cp "$APK" artifacts/Mapa_Trayectos_R25_26_Datos_Review.apk
          (cd artifacts && sha256sum Mapa_Trayectos_R25_26_Datos_Review.apk > SHA256SUMS.txt)
      - name: Upload QA-only APK
        uses: actions/upload-artifact@v4
        with:
          name: Mapa-Datos-R25-26-Review
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve direct review download in its own branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Traslados Review CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin feature/mapa-datos-sin-borrado-20261017
          git reset --hard origin/feature/mapa-datos-sin-borrado-20261017
          mkdir -p preview-artifacts
          cp artifacts/Mapa_Trayectos_R25_26_Datos_Review.apk preview-artifacts/
          (cd preview-artifacts && sha256sum Mapa_Trayectos_R25_26_Datos_Review.apk > MAPA-DATOS-REVIEW-SHA256SUMS.txt)
          git add preview-artifacts/Mapa_Trayectos_R25_26_Datos_Review.apk preview-artifacts/MAPA-DATOS-REVIEW-SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: attach verified Mapa Datos review APK (no deployment)"
            git push origin HEAD:feature/mapa-datos-sin-borrado-20261017
          fi
