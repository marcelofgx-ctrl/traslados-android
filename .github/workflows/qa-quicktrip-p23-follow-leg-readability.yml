name: QA Quick Trip P2.4 — header and animated pickup follow (NO RELEASE)
on:
  push:
    branches:
      - qa/quicktrip-p24-motion-collapse-car-20261102
permissions:
  contents: read
jobs:
  p24-motion-collapse-car:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Strict P2.3 lineage and visual-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=5e53fc9e70db6c02f822a11553e6f9f99c5543c5
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          mapfile -t files < <(git diff --name-only "$BASE"..HEAD | LC_ALL=C sort)
          test "${#files[@]}" -eq 8
          for file in "${files[@]}"; do
            case "$file" in
              web-pasajero/quicktrip-p24-tracking-polish.css|web-pasajero/premium-map.js|web-pasajero/quicktrip-map-focus.js|web-pasajero/index.html|web-pasajero/sw.js|scripts/qa_quicktrip_tracking_metrics_browser.cjs|tests/quicktrip-p24-tracking-polish-contract.cjs|.github/workflows/qa-quicktrip-p23-follow-leg-readability.yml) ;;
              *) echo "FAIL unauthorized QA change: $file"; exit 1;;
            esac
          done
          git diff --quiet "$BASE"..HEAD -- mapatrayectos/ conductor/ supabase/ core-reservations/ web-pasajero/app.js web-pasajero/route-engine.js web-pasajero/eta-engine.js web-pasajero/reservation-live.js web-pasajero/quicktrip-map-focus.css web-pasajero/quicktrip-p23-follow-leg-readability.css vercel.json
      - name: Source integrity contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/qa_quicktrip_tracking_metrics_browser.cjs
          node --check web-pasajero/quicktrip-map-focus.js
          node --check web-pasajero/premium-map.js
          node tests/quicktrip-p24-tracking-polish-contract.cjs
          node tests/quicktrip-tracking-metrics-contract.cjs
          node web-pasajero/tests/tracking-fases-gps-real-smoke.cjs
          node web-pasajero/tests/reservation-live-v82-smoke.cjs
      - name: Chromium QA: auto-collapse, manual toggle, vector car, animation and ride phases
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa_quicktrip_tracking_metrics_browser.cjs
      - name: Retain responsive screenshots (synthetic booking only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quicktrip-p24-motion-collapse-vehicle-qa
          path: artifacts/quicktrip-tracking-metrics/
          retention-days: 14
          if-no-files-found: warn
