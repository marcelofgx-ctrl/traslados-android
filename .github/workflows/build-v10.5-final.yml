      - name: Apply Conductor v10.1 agenda polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYV101UI'
          from pathlib import Path
          import base64
          p=Path('conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          pairs=[
              ('','','campos Agenda'),
              ('','','layout Agenda'),
              ('ICAgICAgICBpZihhZ2VuZGFMYWJlbCE9bnVsbCYmIWhpc3QpYWdlbmRhTGFiZWwuc2V0VGV4dChhZ2VuZGFEZXNjcmlwdGlvbigpKTs=','ICAgICAgICBpZighaGlzdClyZWZyZXNoQWdlbmRhQ29udHJvbHMoKTs=','refresh Agenda'),
              ('','','helpers Agenda'),
          ]
          for old64,new64,label in pairs:
              old=base64.b64decode(old64).decode('utf-8');new=base64.b64decode(new64).decode('utf-8')
              if old not in s: raise SystemExit('No se encontró bloque v10: '+label)
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PYV101UI

      - name: Apply Conductor v10.2 final visual polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFINALUI'
          from pathlib import Path
          import re

          p=Path('conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java')
          s=p.read_text(encoding='utf-8')

          # Nueva solicitud: normalizar el botón de presupuesto para que sea
          # un rectángulo redondeado regular, sin recortes ni esquinas raras.
          needle='Button accept=primaryButton("PREPARAR PRESUPUESTO");'
          replacement=(
              'Button accept=primaryButton("PREPARAR PRESUPUESTO");'
              'accept.setSingleLine(false);'
              'accept.setMaxLines(2);'
              'accept.setGravity(Gravity.CENTER);'
              'accept.setPadding(dp(12),0,dp(12),0);'
              'accept.setBackground(rounded(GOLD,GOLD,22));'
              'accept.setTextColor(Color.rgb(30,34,31));'
          )
          if needle not in s:
              raise SystemExit('No se encontró botón PREPARAR PRESUPUESTO de nueva solicitud')
          s=s.replace(needle,replacement,1)

          # Forzar individualmente que VER LISTA y PREPARAR PRESUPUESTO
          # tengan la misma altura y el mismo peso. No dependemos de que
          # ambas llamadas estén contiguas ni de espacios exactos en el código.
          list_pat=r'actions\.addView\(list\s*,\s*new LinearLayout\.LayoutParams\(0\s*,\s*dp\(\d+\)\s*,\s*1\)\s*\);'
          accept_pat=r'actions\.addView\(accept\s*,\s*new LinearLayout\.LayoutParams\(0\s*,\s*dp\(\d+\)\s*,\s*1\)\s*\);'
          s,n1=re.subn(list_pat,'actions.addView(list,new LinearLayout.LayoutParams(0,dp(58),1));',s,count=1)
          s,n2=re.subn(accept_pat,'actions.addView(accept,new LinearLayout.LayoutParams(0,dp(58),1));',s,count=1)
          print('Normalización fila acciones:', n1, n2)

          p.write_text(s,encoding='utf-8')
          PYFINALUI

      - name: Apply Conductor v10.3 live dashboard sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYLIVEBOARD'
          from pathlib import Path
          import re

          p=Path('conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java')
          s=p.read_text(encoding='utf-8')

          # El monitor ya detecta la nueva reserva y llama alertNew(r), pero en v10.2
          # el popup podia aparecer antes de que el tablero visual incorporara esa fila.
          # Sincronizamos currentRows en el MISMO evento y redibujamos inmediatamente.
          pat=r'(private\s+void\s+alertNew\s*\(\s*JSONObject\s+r\s*\)\s*\{)'
          m=re.search(pat,s)
          if not m:
              raise SystemExit('No se encontro el metodo alertNew(JSONObject r)')

          live=(
              '\n        // v10.3: el popup y el tablero deben reflejar la misma reserva en el mismo evento.\n'
              '        String incomingId=r.optString("id","");\n'
              '        String incomingCode=r.optString("code","");\n'
              '        boolean dashboardPresent=false;\n'
              '        for(int i=0;i<currentRows.size();i++){\n'
              '            JSONObject row=currentRows.get(i);\n'
              '            boolean same=(!incomingId.isEmpty()&&incomingId.equals(row.optString("id","")))||\n'
              '                         (!incomingCode.isEmpty()&&incomingCode.equals(row.optString("code","")));\n'
              '            if(same){currentRows.set(i,r);dashboardPresent=true;break;}\n'
              '        }\n'
              '        if(!dashboardPresent)currentRows.add(0,r);\n'
              '        if(!historyMode)renderRows(false);\n'
