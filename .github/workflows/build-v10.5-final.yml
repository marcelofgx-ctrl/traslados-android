          rate=22050
          segments=[(0.00,0.16,659.25,0.28),(0.18,0.38,880.00,0.24),(0.40,0.60,1046.50,0.20)]
          frames=[]
          for i in range(int(rate*0.65)):
              t=i/rate; v=0.0
              for a,b,f,amp in segments:
                  if a <= t < b:
                      local=(t-a)/(b-a)
                      env=min(1.0,local*8.0)*max(0.0,1.0-local*local)
                      v += amp*env*math.sin(2*math.pi*f*t)
              frames.append(struct.pack('<h',max(-32767,min(32767,int(v*32767)))))
          with wave.open(out,'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(b''.join(frames))
          PYSOUND

