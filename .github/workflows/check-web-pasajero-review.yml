name: Verify passenger PWA review screen

on:
  push:
    branches:
      - fix/web-pasajero-confirmacion-crypto-20261009
    paths:
      - 'web-pasajero/**'
      - '.github/workflows/check-web-pasajero-review.yml'
  pull_request:
    paths:
      - 'web-pasajero/**'
      - '.github/workflows/check-web-pasajero-review.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get sources
        uses: actions/checkout@v4
      - name: Validate JavaScript and service worker
        run: |
          node --check web-pasajero/geo-search.js
          node --check web-pasajero/address-engine.js
          node --check web-pasajero/route-engine.js
          node --check web-pasajero/eta-engine.js
          node --check web-pasajero/booking-contracts.js
          node --check web-pasajero/booking-steps.js
          node --check web-pasajero/service-home.js
          node --check web-pasajero/owned-pickup.js
          node --check web-pasajero/pickup-cadence.js
          node --check web-pasajero/pickup-observability.js
          test -f web-pasajero/tests/pickup-diagnostics-v70-smoke.cjs
          node --check web-pasajero/trip-board.js
          node --check web-pasajero/public-config.js
          node --check web-pasajero/app.js
          node web-pasajero/tests/search-smoke.cjs
          node web-pasajero/tests/route-engine-smoke.cjs
          node web-pasajero/tests/eta-engine-smoke.cjs
          node web-pasajero/tests/booking-contracts-smoke.cjs
          node web-pasajero/tests/booking-steps-smoke.cjs
          node web-pasajero/tests/booking-finish-premium-smoke.cjs
          node web-pasajero/tests/account-summary-smoke.cjs
          node web-pasajero/tests/route-premium-v45-smoke.cjs
          node web-pasajero/tests/route-mockup-v46-smoke.cjs
          node web-pasajero/tests/route-selected-v47-smoke.cjs
          node web-pasajero/tests/presence-honest-v48-smoke.cjs
          node web-pasajero/tests/booking-send-navigation-v48-smoke.cjs
          node web-pasajero/tests/urgent-request-v49-smoke.cjs
          node web-pasajero/tests/trip-board-v50-smoke.cjs
          node web-pasajero/tests/expired-quotes-v55-smoke.cjs
          node web-pasajero/tests/trip-phase-v51-smoke.cjs
          node web-pasajero/tests/customer-chat-v52-smoke.cjs
          node web-pasajero/tests/mobile-overflow-v53-smoke.cjs
          node web-pasajero/tests/pickup-health-v54-smoke.cjs
          node web-pasajero/tests/pickup-diagnostics-v70-smoke.cjs
          node web-pasajero/tests/pickup-cadence-smoke.cjs
          node web-pasajero/tests/booking-summary-smoke.cjs
          node web-pasajero/tests/journey-composition-v57-smoke.cjs
          node web-pasajero/tests/guided-passenger-flow-v58-smoke.cjs
          node web-pasajero/tests/stable-refresh-v58-smoke.cjs
          node web-pasajero/tests/public-driver-presence-smoke.cjs
          node web-pasajero/tests/pickup-context-copy-v60-smoke.cjs
          node web-pasajero/tests/pickup-motion-v64-smoke.cjs
          node web-pasajero/tests/pickup-eta-stability-v67-smoke.cjs
          node web-pasajero/tests/pickup-expired-session-v71-smoke.cjs
          node web-pasajero/tests/owned-pickup-v65-smoke.cjs
          node web-pasajero/tests/expired-urgent-v66-smoke.cjs
          node web-pasajero/tests/flexible-schedule-r1-smoke.cjs
          node web-pasajero/tests/service-home-v61-smoke.cjs
          node web-pasajero/tests/service-art-v62-smoke.cjs
          node web-pasajero/tests/location-permission-smoke.cjs
          node web-pasajero/tests/public-branding-smoke.cjs
          node web-pasajero/tests/install-flow-smoke.cjs
          node web-pasajero/tests/public-config-v72-smoke.cjs
          node web-pasajero/tests/trip-chat-live-v73-smoke.cjs
          node web-pasajero/tests/urgent-mode-smoke.cjs
          node --check web-pasajero/sw.js
      - name: Verify review flow and offline safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('web-pasajero/app.js').read_text()
          css=Path('web-pasajero/styles.css').read_text()
          html=Path('web-pasajero/index.html').read_text()
          sw=Path('web-pasajero/sw.js').read_text()
          assert 'function showPreview()' in app
          assert 'function submitBooking()' in app
          assert 'customer_create_reservation_v12' in app
          assert 'create_reservation' in app
          assert 'customer_check_availability_v11_4' in app
          assert 'function mapsLinkFromBooking(' in app
          assert 'noopener noreferrer' in app
          assert 'preview-journey' in app and 'preview-budget' in app
          assert 'preview-extra' in app and '.preview-place-name' in css
          assert 'CONFIRMAR SOLICITUD DE RESERVA' in html
          assert 'No se envían reservas offline' in Path('web-pasajero/offline.html').read_text()
          version=html.split('./app.js?v=')[1].split('"')[0]
          assert version.isdigit() and ('traslados-cliente-pwa-v'+version) in sw
          assert 'address-engine.js' in html and 'address-engine.js' in sw
          assert 'route-engine.js' in html and 'route-engine.js' in sw
          assert 'eta-engine.js' in html and 'eta-engine.js' in sw
          assert 'booking-contracts.js' in html and 'booking-contracts.js' in sw
          assert 'booking-steps.js' in html and 'booking-steps.js' in sw
          assert 'pickup-cadence.js' in html and 'pickup-cadence.js' in sw
          assert 'trip-board.js' in html and 'trip-board.js' in sw
          assert 'caches.open(CACHE).then(c=>c.put(r,copy))' in sw
          assert not any(s in app for s in ('sb_secret_','service_role'))
          assert 'gen_random_bytes' not in html
          print('OK: responsive review, booking RPC, no secrets and refreshed PWA assets')
          PY
