name: Quick Trip production - no legacy UI regression
on:
  pull_request:
    paths:
      - 'web-pasajero/**'
      - '.github/workflows/check-quicktrip-v6-functional.yml'
  push:
    branches: [main]
    paths:
      - 'web-pasajero/**'
      - '.github/workflows/check-quicktrip-v6-functional.yml'
permissions:
  contents: read
jobs:
  no-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sole Quick Trip V7 production presentation and preserved engines
        shell: bash
        run: |
          set -euo pipefail
          for old in quicktrip-functional-v6.js quicktrip-functional-v6.css tu-viaje-reference.js tu-viaje-reference.css premium-journey.js premium-journey.css quicktrip-clean-boot.js manifest-quicktrip-clean.webmanifest; do
            test ! -e "web-pasajero/$old"
            ! grep -q "$old" web-pasajero/index.html
          done
          grep -q 'quicktrip-clean.js?v=5' web-pasajero/index.html
          grep -q 'const CACHE="traslados-pwa-v82-quicktrip-v7-production-20261021"' web-pasajero/sw.js
          grep -q 'customer_create_reservation_v12' web-pasajero/app.js
          grep -q 'route-engine.js' web-pasajero/index.html
          grep -q 'premium-route.js' web-pasajero/index.html
          grep -q 'booking-contracts.js' web-pasajero/index.html
          node --check web-pasajero/quicktrip-clean.js
          node --check web-pasajero/app.js
          node --check web-pasajero/premium-route.js
          node web-pasajero/tests/route-engine-smoke.cjs
          node web-pasajero/tests/eta-engine-smoke.cjs
          node web-pasajero/tests/booking-contracts-smoke.cjs
          node web-pasajero/tests/urgent-mode-smoke.cjs
          node web-pasajero/tests/flexible-schedule-r1-smoke.cjs
