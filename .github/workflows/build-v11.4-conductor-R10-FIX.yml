      - name: Verify R10 FIX string escaping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIXCHECK'
          from pathlib import Path
          s=Path('conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java').read_text(encoding='utf-8')
          expected='+(n.isEmpty()?"":"\\n"+n);Button item=secondaryButton(label);'
          if expected not in s:
              raise SystemExit('R10 FIX: escaped schedule-block newline not found')
          bad='+(n.isEmpty()?"":"\n"+n);Button item=secondaryButton(label);'
          # bad contains a real newline because Python interprets \n; reject it if it somehow reappears.
          if bad in s:
              raise SystemExit('R10 FIX: unescaped newline still present')
          print('R10 FIX string escaping OK')
          PYFIXCHECK

