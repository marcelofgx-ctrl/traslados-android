name: Quick Trip V7 - APKs de testing
on:
  pull_request:
    paths:
      - ".github/workflows/quicktrip-v7-apks.yml"

      - "scripts/android_qa_install_preflight.sh"
      - "scripts/prepare_quicktrip_cliente_qa.py"
      - "scripts/prepare_quicktrip_native_qa.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Compilar Quick Trip Pasajero, Conductor y Mapa (QA)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar recursos de Android desde assets codificados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mapatrayectos/src/main/assets mapatrayectos/src/main/res/raw mapatrayectos/src/main/res/drawable-nodpi
          base64 -d mapatrayectos/assets/manrope.ttf.base64 > mapatrayectos/src/main/assets/manrope.ttf
          base64 -d mapatrayectos/assets/reminder_bubbles_elevenlabs.mp3.base64 > mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3
          base64 -d mapatrayectos/assets/logo_c_avatar.jpg.base64 > mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg
          test -s mapatrayectos/src/main/assets/manrope.ttf
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Usar SDK Android instalado en el runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$(printenv ANDROID_SDK_ROOT || true)"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="$(printenv ANDROID_HOME || true)"; fi
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: true
      - name: Asignar identificador QA exclusivo de esta compilación
        shell: bash
        run: |
          echo "QUICKTRIP_QA_INSTALL_ID=r${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Crear copias temporales de Mapa y Conductor con ID aislados
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_quicktrip_native_qa.py \
            --source . \
            --dest "$RUNNER_TEMP/quicktrip-native-qa" \
            --qa-id "r${GITHUB_RUN_ID}"
          git diff --exit-code -- mapatrayectos conductor core-reservations
      - name: Compilar APK debug independiente y APK integrado desde copia temporal
        shell: bash
        run: gradle -p "$RUNNER_TEMP/quicktrip-native-qa" :conductor:assembleDebug :mapatrayectos:assembleDebug --stacktrace --no-daemon
      - name: Crear Quick Trip Pasajero QA fuera de la fuente RELEASE
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_quicktrip_cliente_qa.py \
            --source cliente-premium \
            --dest "$RUNNER_TEMP/quicktrip-pasajero-qa" \
            --qa-id "r${GITHUB_RUN_ID}" \
            --icon web-pasajero/icons/icon-512.png
          git diff --exit-code -- cliente-premium
      - name: Compilar APK Quick Trip Pasajero QA (WebView oficial con ui=clean)
        shell: bash
        run: gradle -p "$RUNNER_TEMP/quicktrip-pasajero-qa" :app:assembleDebug --stacktrace --no-daemon
      - name: Preparar APKs y sumas de control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-apks
          find "$RUNNER_TEMP/quicktrip-native-qa/conductor/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -size +1M -print -quit | grep -q .
          find "$RUNNER_TEMP/quicktrip-native-qa/mapatrayectos/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -size +1M -print -quit | grep -q .
          cp "$RUNNER_TEMP/quicktrip-native-qa/conductor/build/outputs/apk/debug/"*.apk artifacts/test-apks/QuickTrip-Conductor-V7-QA.apk
          cp "$RUNNER_TEMP/quicktrip-native-qa/mapatrayectos/build/outputs/apk/debug/"*.apk artifacts/test-apks/QuickTrip-Mapa-V7-QA.apk
          test -s "$RUNNER_TEMP/quicktrip-pasajero-qa/app/build/outputs/apk/debug/app-debug.apk"
          cp "$RUNNER_TEMP/quicktrip-pasajero-qa/app/build/outputs/apk/debug/app-debug.apk" artifacts/test-apks/QuickTrip-Pasajero-V7-QA.apk
          echo "QA Android installation preflight (no uninstall, no data deletion)"
          bash scripts/android_qa_install_preflight.sh artifacts/test-apks/QuickTrip-Pasajero-V7-QA.apk "uy.com.traslados.cliente.qa.r${GITHUB_RUN_ID}"
          bash scripts/android_qa_install_preflight.sh artifacts/test-apks/QuickTrip-Conductor-V7-QA.apk "uy.com.traslados.conductor.qa.r${GITHUB_RUN_ID}"
          bash scripts/android_qa_install_preflight.sh artifacts/test-apks/QuickTrip-Mapa-V7-QA.apk "uy.com.mapatrayectos.qa.r${GITHUB_RUN_ID}"
          sha256sum artifacts/test-apks/*.apk | tee artifacts/test-apks/SHA256SUMS.txt
          {
            echo "COMMIT: $GITHUB_SHA"
            echo "QA build: $GITHUB_RUN_ID"
            echo "Conductor QA package: uy.com.traslados.conductor.qa.r${GITHUB_RUN_ID}"
            echo "Mapa QA package: uy.com.mapatrayectos.qa.r${GITHUB_RUN_ID}"
            echo "Quick Trip Pasajero QA package: uy.com.traslados.cliente.qa.r${GITHUB_RUN_ID}"
            echo "Quick Trip QA WebView: https://marcelofgx-ctrl.github.io/traslados-android/web-pasajero/?ui=clean"
            echo "La APK oficial Cliente Premium sigue intacta."
            echo "NO desinstala originales. NO usa identificadores de producción."
            echo "Cada compilación QA tiene un ID diferente, evitando colisiones de firma con builds anteriores."
            echo "QA debug signing; not a production-signed release."
          } > artifacts/test-apks/BUILD-INFO.txt
      - name: Adjuntar APKs descargables
        uses: actions/upload-artifact@v4
        with:
          name: quicktrip-v7-apks-qa-sin-conflicto
          path: artifacts/test-apks/
          retention-days: 14
          if-no-files-found: error
