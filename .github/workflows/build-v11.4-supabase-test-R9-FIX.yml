      - name: Restore v11.4 audio resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cliente/src/main/res/raw conductor/src/main/res/raw
          python3 - <<'PYSOUND'
          import math, struct, wave

          def make_wav(path, rate, duration, tones):
              frames=[]
              for i in range(int(rate*duration)):
                  t=i/rate
                  v=0.0
                  for a,b,f,amp in tones:
                      if a <= t < b:
                          local=(t-a)/(b-a)
                          env=min(1.0,local*8.0)*max(0.0,1.0-local*local)
                          v += amp*env*math.sin(2*math.pi*f*t)
                  frames.append(struct.pack('<h',max(-32767,min(32767,int(v*32767)))))
              with wave.open(path,'wb') as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(rate)
                  w.writeframes(b''.join(frames))

          make_wav(
              'cliente/src/main/res/raw/cliente_actualizacion.wav',
              22050, 0.65,
              [(0.00,0.16,659.25,0.28),(0.18,0.38,880.00,0.24),(0.40,0.60,1046.50,0.20)]
          )
          make_wav(
              'conductor/src/main/res/raw/reserva_calida.wav',
              22050, 0.78,
              [(0.00,0.20,523.25,0.30),(0.22,0.46,659.25,0.27),(0.48,0.74,783.99,0.23)]
          )
          PYSOUND

          test -s cliente/src/main/res/raw/cliente_actualizacion.wav
          test -s conductor/src/main/res/raw/reserva_calida.wav

