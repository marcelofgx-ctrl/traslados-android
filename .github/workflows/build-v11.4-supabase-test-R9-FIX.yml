      - name: Set v11.4 versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERSION'
          from pathlib import Path
          import re
          for module in ('cliente','conductor'):
              p=Path(module)/'build.gradle'
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'versionCode\s+\d+','versionCode 117',s,count=1)
              s=re.sub(r"versionName\s+'[^']+'","versionName '11.4-R9'",s,count=1)
              p.write_text(s,encoding='utf-8')
          PYVERSION

      - name: Verify v11.4 source
        shell: bash
        run: |
          set -euo pipefail
          C=cliente/src/main/java/uy/com/traslados/cliente
          D=conductor/src/main/java/uy/com/traslados/conductor
          grep -q '^import android.media.MediaPlayer;$' "$D/MainActivity.java"

          grep -q "versionCode 117" cliente/build.gradle
          grep -q "versionName '11.4-R9'" cliente/build.gradle
          grep -q "versionCode 117" conductor/build.gradle
          grep -q "versionName '11.4-R9'" conductor/build.gradle
          grep -q 'El teléfono o el PIN no son correctos' cliente/src/main/java/uy/com/traslados/cliente/Api.java
