# ACTUALIZADO: 2026-10-02
# VERSION: v11.4 TEST R9 FIX contra Supabase propio de Marcelo
# FIX: corrige únicamente las dos aserciones stale versionCode 116 -> 117 del gate de verificación
# BASE: fuente exacto v11.3 exitoso (run 36962072110)

name: Build Traslados v11.4 SUPABASE TEST R9 FIX - Cliente y Conductor

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v11.4-supabase-test-R9-FIX.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android base and v9 packages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/c059c89bac5a5ebb423176af474134a289f88418/.github/workflows/build-apks.yml" -o /tmp/base-v4.yml
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/d819c60656fe1934be9d6aa31eefdea7beb041be/.github/workflows/build-apks.yml" -o /tmp/cliente-v9.yml
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/d819c60656fe1934be9d6aa31eefdea7beb041be/.github/workflows/build-conductor.yml" -o /tmp/conductor-v9.2.yml

          python3 - <<'PYRESTORE'
          import base64, io, re, tarfile
          from pathlib import Path

          base=Path('/tmp/base-v4.yml').read_text(encoding='utf-8')
          m=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| tar -xz",base)
          if not m:
              raise SystemExit('No se encontró el proyecto Android base')
          raw=base64.b64decode(m.group(1),validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              tf.extractall('.')

          def overlay(path,label):
              txt=Path(path).read_text(encoding='utf-8')
              m=re.search(r"payload\s*=\s*\(([\s\S]*?)\n\s*\)",txt)
              if not m:
                  raise SystemExit('No se encontró payload '+label)
              pieces=re.findall(r'"([A-Za-z0-9+/=]+)"',m.group(1))
              if not pieces:
                  raise SystemExit('Payload vacío '+label)
              raw=base64.b64decode(''.join(pieces),validate=True)
              with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
                  tf.extractall('.')
              print(label,len(raw),'bytes')

          overlay('/tmp/cliente-v9.yml','Cliente v9.0')
          overlay('/tmp/conductor-v9.2.yml','Conductor v9.2')
          PYRESTORE

          grep -q "versionName '9.0'" cliente/build.gradle
          grep -q "versionName '9.2'" conductor/build.gradle
          echo "Bases Android restauradas"

      - name: Download exact successful v11.3 patched source
        uses: actions/download-artifact@v4
        with:
          name: Traslados-v11.3-patched-source
          path: /tmp/v113
          github-token: ${{ github.token }}
          repository: marcelofgx-ctrl/traslados-android
          run-id: 36962072110

      - name: Overlay exact v11.3 successful source
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/v113/cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          test -f /tmp/v113/conductor/src/main/java/uy/com/traslados/conductor/TripTelemetryService.java
          cp -a /tmp/v113/cliente/. cliente/
          cp -a /tmp/v113/conductor/. conductor/
          echo "Fuente exacto v11.3 restaurado"

