          grep -q 'Api.init(getApplicationContext())' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java

          grep -q 'https://zetaudvvutlouiqxopvg.supabase.co' "$C/Api.java"
          grep -q 'https://zetaudvvutlouiqxopvg.supabase.co' "$D/Api.java"
          ! grep -q 'c--37e5ea75-667b-4c05-b55b-52dddb9e82f3-prod.lovable.cloud' "$C/Api.java"
          ! grep -q 'c--37e5ea75-667b-4c05-b55b-52dddb9e82f3-prod.lovable.cloud' "$D/Api.java"

