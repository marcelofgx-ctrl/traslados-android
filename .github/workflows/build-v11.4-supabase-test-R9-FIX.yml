      - name: Fix R8 Conductor MediaPlayer import and build labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYR8FIX'
          from pathlib import Path

          p=Path('conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          if 'import android.media.MediaPlayer;' not in s:
              needle='import android.net.Uri;\n'
              if needle not in s:
                  raise SystemExit('No se encontró import android.net.Uri; en Conductor MainActivity.java')
              s=s.replace(needle, 'import android.media.MediaPlayer;\n'+needle, 1)
          p.write_text(s,encoding='utf-8')

          # R8 is a compile-fix release over the complete R7 product-polish patch.
          for rel in [
              'cliente/src/main/java/uy/com/traslados/cliente/Api.java',
              'conductor/src/main/java/uy/com/traslados/conductor/Api.java',
          ]:
              q=Path(rel)
              t=q.read_text(encoding='utf-8')
              t=t.replace('11.4-R7','11.4-R8')
              q.write_text(t,encoding='utf-8')
          PYR8FIX
          grep -q '^import android.media.MediaPlayer;$' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java

