name: Smoke test Conductor release signing

on:
  push:
    branches:
      - feature/conductor-release-signing
    paths:
      - 'conductor/build.gradle'
      - '.github/workflows/release-signing-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate disposable smoke-test signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/smoke-release.jks"
          PASS="smoke-$(openssl rand -hex 16)"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias traslados-conductor \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Smoke Test, O=Traslados, C=UY'
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo 'ANDROID_KEY_ALIAS=traslados-conductor' >> "$GITHUB_ENV"

      - name: Build release with signing config
        shell: bash
        run: |
          set -euo pipefail
          gradle :conductor:assembleRelease --stacktrace

      - name: Verify generated release APK is signed
        shell: bash
        run: |
          set -euo pipefail
          APK='conductor/build/outputs/apk/release/conductor-release.apk'
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
