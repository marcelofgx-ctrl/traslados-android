name: QA Cliente Mosaico Android WebView both modes
on:
  push:
    branches: [feature/traslados-cliente-mosaico-20261016]
    paths:
      - '.github/workflows/qa-cliente-mosaico-webview.yml'
      - 'scripts/qa_cliente_mosaico_android.sh'
      - 'cliente-premium/preview-tests/**'
      - 'cliente-premium/app/src/main/java/**'
      - 'cliente-premium/app/build.gradle'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-cliente-mosaico-android
  cancel-in-progress: true
jobs:
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify static native security before emulator
        run: |
          python3 cliente-premium/tests/check_premium_shell.py
          python3 scripts/verify_passenger_mosaic.py
          python3 -m unittest discover -s scripts/tests -p test_passenger_assets.py -q
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: One emulator, sequential isolated + operational WebView regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: bash scripts/qa_cliente_mosaico_android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cliente-Mosaico-WebView-Isolated-And-Operational-QA
          path: qa-cliente-mosaico/
          if-no-files-found: warn
          retention-days: 14
