name: Cliente v18 in-card tracking — signed review (no public web deploy)
on:
  push:
    branches: [feature/cliente-seguimiento-integrado-20261017]
    paths:
      - '.github/workflows/build-cliente-v18-seguimiento-signed.yml'
      - 'web-pasajero/**'
      - 'cliente-premium/**'
      - 'scripts/prepare_premium_preview.py'
      - 'scripts/passenger_assets.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: cliente-v18-live-review
  cancel-in-progress: false
jobs:
  signed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test integrated reservation frontend and no-fake-location rules
        shell: bash
        run: |
          set -euo pipefail
          node --check web-pasajero/reservation-live.js
          node --check web-pasajero/app.js
          node web-pasajero/tests/reservation-live-v79-smoke.cjs
          python3 cliente-premium/tests/check_premium_shell.py
          python3 -m unittest discover -s scripts/tests -p test_passenger_assets.py -q
          python3 scripts/verify_passenger_mosaic.py
      - name: Embed same-source operational PWA into signed QA Android (NOT official deployed site)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_premium_preview.py --operational
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cliente-premium/app/build.gradle');s=p.read_text()
          assert "applicationId 'uy.com.traslados.cliente'" in s
          assert s.count('versionCode 215')==1
          assert s.count("versionName '27.0-Premium-Mosaico'")==1
          assert "MOSAIC_PREVIEW_MODE', 'true'" in s
          assert "MOSAIC_PREVIEW_OPERATIONAL', 'true'" in s
          s=s.replace('versionCode 215','versionCode 206').replace("versionName '27.0-Premium-Mosaico'","versionName '18.0-Seguimiento-Review'")
          p.write_text(s)
          p=Path('cliente-premium/app/src/main/java/uy/com/traslados/cliente/MainActivity.java')
          j=p.read_text()
          assert 'TrasladosClienteNative/27 Mosaico' in j
          p.write_text(j.replace('TrasladosClienteNative/27 Mosaico','TrasladosClienteNative/18 Mosaico'))
          assets=Path('cliente-premium/app/src/main/assets/premium-preview')
          assert (assets/'reservation-live.js').is_file()
          assert 'customer_reservation_position_v1' in (assets/'reservation-live.js').read_text()
          assert 'reservation-live.js' in (assets/'index.html').read_text()
          assert 'customer_reservation_position_v1' in Path('cliente-premium/app/src/main/java/uy/com/traslados/cliente/MosaicPreviewGateway.java').read_text()
          print('PASS: original package, Android v18/code206, locally bundled operational passenger tracking UI')
          PY
          mkdir -p cliente-premium/app/src/main/res/drawable-nodpi
          cp web-pasajero/icons/icon-512.png cliente-premium/app/src/main/res/drawable-nodpi/traslados_brand.png
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Restore official release signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TRASLADOS_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
      - name: Compile release Android APK (no debug suffix)
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: traslados-conductor
          ANDROID_KEY_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: gradle -p cliente-premium :app:assembleRelease --no-daemon --console=plain --stacktrace
      - name: Verify package, signer against installed Cliente v17, and embedded same-source web
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APK='cliente-premium/app/build/outputs/apk/release/app-release.apk'
          mkdir -p artifacts /tmp/cliente-base
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > artifacts/SIGNING.txt
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" > artifacts/APK_INFO.txt
          gh release download cliente-v17-actualizaciones-review-20261017 -p 'Traslados_Cliente_v17_Actualizaciones_Review_RELEASE.apk' -D /tmp/cliente-base
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs /tmp/cliente-base/*.apk > /tmp/base-signing.txt
          python3 - <<'PY'
          import re,hashlib,json,zipfile
          from pathlib import Path
          info=Path('artifacts/APK_INFO.txt').read_text()
          assert "package: name='uy.com.traslados.cliente' versionCode='206' versionName='18.0-Seguimiento-Review'" in info,info[:300]
          def digest(p):
            m=re.search(r'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})',Path(p).read_text())
            assert m,'Missing signer certificate digest'
            return m.group(1).lower()
          assert digest('artifacts/SIGNING.txt')==digest('/tmp/base-signing.txt'),'CRITICAL signer mismatch'
          a=Path('cliente-premium/app/build/outputs/apk/release/app-release.apk')
          expected=json.loads(Path('preview-web-sha256.json').read_text())
          with zipfile.ZipFile(a) as z:
            for name,d in expected.items():
              payload=z.read('assets/premium-preview/'+name)
              assert hashlib.sha256(payload).hexdigest()==d,name
            js=z.read('assets/premium-preview/reservation-live.js').decode()
            assert 'customer_reservation_position_v1' in js
            assert 'gpsAgeSec' in js and 'preparing_pickup' in js
          print('PASS: exact signed APK, original package, code206 and 1:1 passenger assets')
          PY
          cp "$APK" artifacts/Traslados_Cliente_v18_Seguimiento_Integrado_REVIEW.apk
          (cd artifacts && sha256sum Traslados_Cliente_v18_Seguimiento_Integrado_REVIEW.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          date -u +'%Y-%m-%dT%H:%M:%SZ' > artifacts/BUILT_AT_UTC.txt
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cliente-v18-Seguimiento-Integrado-SIGNED
          path: artifacts/
          retention-days: 60
          if-no-files-found: error
      - name: Publish QA prerelease (not public PWA or stable catalog)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=cliente-v18-seguimiento-integrado-review-20261017
          APK=artifacts/Traslados_Cliente_v18_Seguimiento_Integrado_REVIEW.apk
          NOTES='APK de prueba con diseño Cliente/PWA premium embebido desde la misma fuente y posición GPS por reserva autenticada. Misma firma y paquete uy.com.traslados.cliente (versionCode 206), reemplaza v16/v17. No es una publicación oficial. Usa backend real. El mapa sólo señala posición recibida y ruta vial verificada; requiere Mapa R25.27 y fase EN_CAMINO/EN_VIAJE. Conservar respaldos antes de instalar.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" artifacts/SHA256SUMS.txt artifacts/APK_INFO.txt artifacts/SIGNING.txt --clobber
          else
            gh release create "$TAG" "$APK" artifacts/SHA256SUMS.txt artifacts/APK_INFO.txt artifacts/SIGNING.txt --target "$GITHUB_SHA" --title 'Cliente v18 · Seguimiento integrado (PRUEBA)' --notes "$NOTES" --prerelease
          fi
          mkdir -p /tmp/download-check
          gh release download "$TAG" -p 'Traslados_Cliente_v18_Seguimiento_Integrado_REVIEW.apk' -D /tmp/download-check
          cmp "$APK" /tmp/download-check/*.apk
          echo 'PASS: verified remote signed prerelease APK'
