name: Quick Trip v90 - acceleration pilot QA only - NO DEPLOY
on:
  push:
    branches: [qa/quicktrip-v90-acceleration-pilot-20261026]
    paths:
      - '.github/workflows/qa-quicktrip-v90-acceleration-pilot.yml'
      - 'scripts/qa_workflow_inventory.py'
      - 'web-pasajero/tests/quicktrip-v90-acceleration-pilot.cjs'
      - 'docs/QA_QUICKTRIP_V90_ACCELERATION_PILOT_20261026.md'
      - 'web-pasajero/tests/quicktrip-v90-pwa-cache-qa.cjs'
      - 'web-pasajero/tests/quicktrip-v90-gps-visual-qa.cjs'
      - 'web-pasajero/tests/quicktrip-v90-route-sandbox.cjs'
      - 'web-pasajero/tests/quicktrip-visual-core-v1-qa.cjs'
      - 'docs/QT_VISUAL_CORE_V1_QA.md'
      - 'docs/quicktrip-visual-core-v1.catalog.json'
      - 'web-pasajero/quicktrip-qa-route-v90.js'
      - 'web-pasajero/quicktrip-qa-route-v90.css'
      - 'web-pasajero/quicktrip-qa-stage-b-v90.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-and-synthetic-web-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect exact v90 base and strictly additive scope
        id: qt_scope_guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base="8d882e63e1a4e779f956868af64c9e6158c4c0ac"
          allowed={
            ".github/workflows/qa-quicktrip-v90-acceleration-pilot.yml",
            "scripts/qa_workflow_inventory.py",
            "web-pasajero/tests/quicktrip-v90-acceleration-pilot.cjs",
            "docs/QA_QUICKTRIP_V90_ACCELERATION_PILOT_20261026.md",
            "docs/QA_QUICKTRIP_V90_REVISION_VISUAL_PLAN_PWA_GPS_20261026.md",
            "web-pasajero/tests/quicktrip-v90-pwa-cache-qa.cjs",
            "web-pasajero/tests/quicktrip-v90-gps-visual-qa.cjs",
            "web-pasajero/sw.js",
            "web-pasajero/quicktrip-qa-route-v90.js",
            "web-pasajero/quicktrip-qa-route-v90.css",
            "web-pasajero/tests/quicktrip-v90-route-sandbox.cjs",
            "docs/QA_CANAL_SOLICITUDES_MAPA_QT_20261026.md",
            "docs/QT_VISUAL_CORE_V1_QA.md",
            "docs/quicktrip-visual-core-v1.catalog.json",
            "web-pasajero/index.html",
            "web-pasajero/quicktrip-qa-samsung-v87.js",
            "web-pasajero/quicktrip-qa-stage-b-v90.css",
            "web-pasajero/quicktrip-qa-stage-b-v90.js",
            "web-pasajero/tests/quicktrip-visual-core-v1-qa.cjs",
            "docs/QA_CANAL_SOLICITUDES_SCHEMA_PROPUESTO.sql",
            "qa/backend-worker/README.md",
            "qa/backend-worker/package.json",
            "qa/backend-worker/schema.sql",
            "qa/backend-worker/src.mjs",
            "qa/backend-worker/test/worker.test.mjs",
            "qa/backend-worker/wrangler.example.jsonc"
          }
          actual=set(subprocess.check_output(["git","diff","--name-only",base+"..HEAD"],text=True).splitlines())
          assert actual==allowed,("SCOPE VIOLATION",sorted(actual^allowed))
          # Parallel backend QA work is present on this existing branch.
          # It is NOT part of Visual Core: pin every historical backend blob.
          baseline="cafdc75962b0ae939e1207f71bf15b63221b8c0c"
          protected_backend=["docs/QA_CANAL_SOLICITUDES_SCHEMA_PROPUESTO.sql","qa/backend-worker/README.md","qa/backend-worker/package.json","qa/backend-worker/schema.sql","qa/backend-worker/src.mjs","qa/backend-worker/test/worker.test.mjs","qa/backend-worker/wrangler.example.jsonc"]
          for path in protected_backend:
            expected=subprocess.check_output(["git","rev-parse",f"{baseline}:{path}"],text=True).strip()
            current=subprocess.check_output(["git","rev-parse",f"HEAD:{path}"],text=True).strip()
            assert current==expected,("BACKEND_SCOPE_VIOLATION",path,expected,current)
          status=subprocess.check_output(["git","status","--porcelain"],text=True).strip()
          assert not status,("Dirty source checkout",status)
          html=open("web-pasajero/index.html",encoding="utf8").read()
          assert 'name="traslados-preview" content="read-only"' in html
          import re
          csp=re.search(r'<meta http-equiv="Content-Security-Policy" content="([^"]+)"',html)
          assert csp, "Missing CSP in isolated QA"
          parts=[p.strip().split() for p in csp.group(1).split(";") if p.strip()]
          directives={p[0]:p[1:] for p in parts}
          read_only=[
            "https://direcciones.ide.uy",
            "https://router.project-osrm.org",
            "https://zetaudvvutlouiqxopvg.supabase.co/rest/v1/rpc/public_driver_availability_v1",
            "https://zetaudvvutlouiqxopvg.supabase.co/functions/v1/pickup-eta",
          ]
          assert directives.get("connect-src")==read_only, ("Unexpected connect-src",directives.get("connect-src"))
          assert "form-action 'none'" in html and 'quicktrip-qa-route-v90.js?v=90' in html
          print("PASS: QA-only and documentation files; v90 sources untouched; all original v90 files untouched")
          PY
      - name: Inventory and local static build without APK or publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/qa_workflow_inventory.py
          python3 scripts/qa_workflow_inventory.py --output quicktrip-v90-pilot-evidence/inventory
          node --check web-pasajero/tests/quicktrip-v90-acceleration-pilot.cjs
          node --check web-pasajero/tests/quicktrip-v90-pwa-cache-qa.cjs
          node --check web-pasajero/tests/quicktrip-v90-gps-visual-qa.cjs
          node --check web-pasajero/tests/quicktrip-v90-route-sandbox.cjs
          node --check web-pasajero/tests/quicktrip-visual-core-v1-qa.cjs
          node web-pasajero/tests/quicktrip-visual-core-v1-qa.cjs
          node web-pasajero/qa-stage-build.cjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("quicktrip-v90-pilot-evidence/inventory/WORKFLOWS_INVENTORY.json")
          v=json.loads(p.read_text(encoding="utf8"))
          assert v["yaml_count"]==74,(v["yaml_count"],"expected v90 73 + this pilot")
          assert v["other_count"]==3
          assert v["total_files"]==77
          assert not any(Path("web-pasajero/dist").rglob("*.apk"))
          assert not any(Path("web-pasajero/dist").rglob("*.aab"))
          print("PASS: inventory 74 YAML + 3 non-YAML; static-only QA bundle, zero APK")
          PY
      - name: Install browser harness, no source dependency changes
        id: qt_browser_ready
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --prefix /tmp/qt-v90-acceleration --no-save --no-audit --no-fund playwright-core@1.56.1
          echo "NODE_PATH=/tmp/qt-v90-acceleration/node_modules" >> "$GITHUB_ENV"
      - name: QT Visual Core v1 existing Chromium mobile visual checks
        if: ${{ always() && steps.qt_scope_guard.outcome == 'success' && steps.qt_browser_ready.outcome == 'success' }}
        env:
          QA_DIR: quicktrip-v90-pilot-evidence/visual-core
        run: node web-pasajero/tests/quicktrip-visual-core-v1-qa.cjs --browser
      - name: Existing v90 real-browser mocked regression baseline
        if: ${{ always() && steps.qt_scope_guard.outcome == 'success' && steps.qt_browser_ready.outcome == 'success' }}
        env:
          QA_DIR: quicktrip-v90-pilot-evidence/baseline
        run: node web-pasajero/tests/quicktrip-v90-route-sandbox.cjs
      - name: Extended negative testing stops, recalculation, prices, disconnect
        if: ${{ always() && steps.qt_scope_guard.outcome == 'success' && steps.qt_browser_ready.outcome == 'success' }}
        env:
          QA_DIR: quicktrip-v90-pilot-evidence/negative
        run: node web-pasajero/tests/quicktrip-v90-acceleration-pilot.cjs
      - name: Test real PWA Service Worker cache and synthetic v91 upgrade (localhost only)
        if: ${{ always() && steps.qt_scope_guard.outcome == 'success' && steps.qt_browser_ready.outcome == 'success' }}
        env:
          QA_DIR: quicktrip-v90-pilot-evidence/pwa-cache
        run: node web-pasajero/tests/quicktrip-v90-pwa-cache-qa.cjs
      - name: Test synthetic GPS permissions and viewport overlap (localhost only)
        if: ${{ always() && steps.qt_scope_guard.outcome == 'success' && steps.qt_browser_ready.outcome == 'success' }}
        env:
          QA_DIR: quicktrip-v90-pilot-evidence/gps-visual
        run: node web-pasajero/tests/quicktrip-v90-gps-visual-qa.cjs
      - name: Upload inventory JSON, results and screenshots (NEVER DEPLOY)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuickTrip-v90-Acceleration-QA-Evidence
          path: quicktrip-v90-pilot-evidence/
          retention-days: 14
          if-no-files-found: warn
