name: Quick Trip v85 - QA funcional aislado (NO DEPLOY / NO SUPABASE)
on:
  push:
    branches:
      - qa/quicktrip-v85-funcional-aislado-20261024
    paths:
      - .github/workflows/quicktrip-v85-functional-isolated-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Blindaje de diff: 0 cambios en producción, Android o motores
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base='05e2aaca3d785c5aad7a6359c325d4fd9b3fa440'
          changed=set(subprocess.check_output(['git','diff','--name-only',
            base+'..HEAD'],text=True).splitlines())
          allowed={
            'web-pasajero/tests/quicktrip-v85-functional-isolated-browser.cjs',
            '.github/workflows/quicktrip-v85-functional-isolated-qa.yml'
          }
          assert changed==allowed,(sorted(changed-allowed),sorted(allowed-changed))
          print('PASS: solo test funcional y workflow; ninguna app, base ni reserva modificada')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contratos originales y pruebas de regresión puras
        shell: bash
        run: |
          set -euo pipefail
          node --check web-pasajero/tests/quicktrip-v85-functional-isolated-browser.cjs
          node web-pasajero/tests/booking-contracts-smoke.cjs
          node web-pasajero/tests/urgent-request-v49-smoke.cjs
          node web-pasajero/tests/route-engine-smoke.cjs
          node web-pasajero/tests/eta-engine-smoke.cjs
          node web-pasajero/tests/search-smoke.cjs
          node web-pasajero/tests/address-picker-regression-v82-smoke.cjs
          node web-pasajero/tests/reservation-live-v82-smoke.cjs
          node web-pasajero/tests/quicktrip-three-services-v84-smoke.cjs
          node web-pasajero/tests/quicktrip-mobile-skin-v83-smoke.cjs
      - name: Instalar Playwright CORE usando Chromium del runner
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH" || exit 1
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --prefix /tmp/quicktrip-v85-functional --no-save --no-audit --no-fund playwright-core@1.56.1
          echo "NODE_PATH=/tmp/quicktrip-v85-functional/node_modules" >> "$GITHUB_ENV"
      - name: Ejecutar UI y envío aislado contra backend 100% falso
        env:
          QA_DIR: ${{ github.workspace }}/quicktrip-v85-functional-qa
        run: |
          set -euo pipefail
          node web-pasajero/tests/quicktrip-v85-functional-isolated-browser.cjs
      - name: Guardar evidencias de QA (no publicar Pages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuickTrip-v85-QA-Funcional-Aislado-NoPublicar
          path: quicktrip-v85-functional-qa/
          if-no-files-found: warn
          retention-days: 14
