name: Mapa QT R25.38 - Solicitudes integradas firmado aislado
on:
  push:
    branches: [feat/quicktrip-solicitudes-focus-y-estado-pasajero-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Proteger R25.37, motores originales y único APK Mapa QT
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base='a629002a5e5b794029a78d5d60254a1d461791a0'
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',base+'..HEAD'],text=True).splitlines())
          expected={
              '.github/workflows/mapa-qt-conductor-v0-firmada.yml',
              '.github/workflows/quicktrip-request-flow-source-qa.yml',
              'conductor/src/main/java/uy/com/traslados/conductor/ReservationMonitorService.java',
              'mapatrayectos/build.gradle',
              'mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java',
              'mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java',
              'mapatrayectos/src/main/java/uy/com/mapatrayectos/conductorv0/ConductorIncomingPolicy.java',
              'mapatrayectos/src/main/java/uy/com/mapatrayectos/conductorv0/ConductorLiveController.java',
              'mapatrayectos/src/main/java/uy/com/mapatrayectos/conductorv0/ConductorV0Navigator.java',
              'mapatrayectos/tests/ConductorIncomingPolicyTest.java',
              'web-pasajero/app.js',
              'web-pasajero/index.html',
              'web-pasajero/styles.css',
              'web-pasajero/sw.js',
              'web-pasajero/tests/account-summary-smoke.cjs',
              'web-pasajero/tests/booking-finish-premium-smoke.cjs',
              'web-pasajero/tests/customer-chat-v52-smoke.cjs',
              'web-pasajero/tests/expired-quotes-v55-smoke.cjs',
              'web-pasajero/tests/expired-urgent-v66-smoke.cjs',
              'web-pasajero/tests/flexible-schedule-r1-smoke.cjs',
              'web-pasajero/tests/guided-passenger-flow-v58-smoke.cjs',
              'web-pasajero/tests/journey-composition-v57-smoke.cjs',
              'web-pasajero/tests/mobile-overflow-v53-smoke.cjs',
              'web-pasajero/tests/owned-pickup-v65-smoke.cjs',
              'web-pasajero/tests/pickup-context-copy-v60-smoke.cjs',
              'web-pasajero/tests/pickup-diagnostics-v70-smoke.cjs',
              'web-pasajero/tests/pickup-eta-stability-v67-smoke.cjs',
              'web-pasajero/tests/pickup-expired-session-v71-smoke.cjs',
              'web-pasajero/tests/pickup-health-v54-smoke.cjs',
              'web-pasajero/tests/pickup-motion-v64-smoke.cjs',
              'web-pasajero/tests/presence-honest-v48-smoke.cjs',
              'web-pasajero/tests/public-config-v72-smoke.cjs',
              'web-pasajero/tests/route-mockup-v46-smoke.cjs',
              'web-pasajero/tests/route-premium-v45-smoke.cjs',
              'web-pasajero/tests/route-selected-v47-smoke.cjs',
              'web-pasajero/tests/service-art-v62-smoke.cjs',
              'web-pasajero/tests/service-home-v61-smoke.cjs',
              'web-pasajero/tests/trip-board-v50-smoke.cjs',
              'web-pasajero/tests/trip-chat-live-v73-smoke.cjs',
              'web-pasajero/tests/trip-decision-v76-smoke.cjs',
              'web-pasajero/tests/trip-phase-v51-smoke.cjs',
              'web-pasajero/tests/urgent-request-v49-smoke.cjs',
              'web-pasajero/trip-board.js',
          }
          assert changed==expected,('Cambios fuera del alcance autorizado',
                                    sorted(changed-expected),sorted(expected-changed))
          for stable in (
              'mapatrayectos/src/main/java/uy/com/mapatrayectos/TransferAlerts.java',
              'mapatrayectos/src/main/java/uy/com/mapatrayectos/conductorv0/ConductorTripActions.java',
              'mapatrayectos/src/main/java/uy/com/mapatrayectos/conductorv0/ConductorQuoteDialog.java',
              'mapatrayectos/src/main/java/uy/com/mapatrayectos/conductorv0/ConductorLiveView.java',
              'conductor/src/main/java/uy/com/traslados/conductor/TripTelemetryService.java',
              'web-pasajero/rpc-client.js',
              'web-pasajero/booking-contracts.js',
          ):
              assert stable not in changed,'Motor estable alterado: '+stable
          gradle=Path('mapatrayectos/build.gradle').read_text()
          assert "applicationId 'uy.com.mapatrayectos'" in gradle
          assert 'versionCode 91' in gradle
          assert "versionName 'MapaQT-0.1-R25.38'" in gradle
          main=Path('mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java').read_text()
          controller=Path('mapatrayectos/src/main/java/uy/com/mapatrayectos/conductorv0/ConductorLiveController.java').read_text()
          tracker=Path('mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java').read_text()
          assert 'showIncomingRequestInConductor();' in main
          assert 'ConductorIncomingPolicy.incomingPattern()' in main
          assert 'onNewIntent(Intent intent)' in main
          assert 'if(onConfirmedImmediateDecision!=null)onConfirmedImmediateDecision.run()' in controller
          assert 'TransferAlerts.decideFixed(activity,id,accepted' in controller
          assert 'if(!appVisible&&bubbleView!=null)showTransferCallout();' in tracker
          print('PASS versionCode 91: motores protegidos; APK Mapa QT única; despliegue NO')
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9', cache-read-only: true}
      - name: Recuperar recursos y Android SDK
        run: |
          set -euo pipefail
          mkdir -p mapatrayectos/src/main/assets mapatrayectos/src/main/res/raw mapatrayectos/src/main/res/drawable-nodpi
          base64 -d mapatrayectos/assets/manrope.ttf.base64 > mapatrayectos/src/main/assets/manrope.ttf
          base64 -d mapatrayectos/assets/reminder_bubbles_elevenlabs.mp3.base64 > mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3
          base64 -d mapatrayectos/assets/logo_c_avatar.jpg.base64 > mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Restaurar certificado original de GitHub
        env:
          KEYSTORE_B64: ${{ secrets.TRASLADOS_SIGNING_KEYSTORE_B64 }}
          PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/traslados-release.jks"
          test -s "$RUNNER_TEMP/traslados-release.jks"
      - name: Compilar solamente Mapa QT release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/traslados-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: traslados-conductor
          ANDROID_KEY_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: gradle :mapatrayectos:assembleRelease --no-daemon --stacktrace
      - name: Verificar firma e identidad de actualización
        run: |
          set -euo pipefail
          APK="$(find mapatrayectos/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='uy.com.mapatrayectos' versionCode='91'" /tmp/badging.txt
          grep -q "application-label:'Mapa QT'" /tmp/badging.txt
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signing.txt
          grep -Eq 'Verified using v2 scheme.*true|Verified using v3 scheme.*true' /tmp/signing.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: d91f4b9a37f4c77653fdf18fe792e7011a046dd2c09fded1e13fd29d4267269d' /tmp/signing.txt
          sha256sum "$APK" | tee /tmp/hash.txt
          cp /tmp/signing.txt mapatrayectos/build/outputs/apk/release/SIGNING.txt
      - name: Conservar un único APK firmado en Actions
        uses: actions/upload-artifact@v4
        with:
          name: Mapa-QT-R25.38-CONDUCTOR-SOLICITUDES-SIGNADA
          path: |
            mapatrayectos/build/outputs/apk/release/*.apk
            mapatrayectos/build/outputs/apk/release/SIGNING.txt
          if-no-files-found: error
          retention-days: 14
