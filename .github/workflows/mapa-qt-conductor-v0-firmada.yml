name: Mapa QT Conductor V0 - release oficial aislada
on:
  push:
    branches: [consolidacion/mapa-qt-conductor-v0-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Comprobar alcance y sin segundo APK
        run: |
          set -euo pipefail
          git diff --name-only 2b44054094a961e638d85f544b13484888298aa4..HEAD > /tmp/scope.txt
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/scope.txt').read_text().splitlines())
          allowed={
            'mapatrayectos/build.gradle',
            'mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java',
            'mapatrayectos/src/main/java/uy/com/mapatrayectos/conductorv0/ConductorV0Navigator.java',
            'mapatrayectos/src/main/java/uy/com/mapatrayectos/conductorv0/ConductorV0View.java',
            'mapatrayectos/src/main/java/uy/com/mapatrayectos/conductorv0/ConductorSwipePolicy.java',
            '.github/workflows/mapa-qt-conductor-v0-firmada.yml',
            'docs/MAPA_QT_CONDUCTOR_V0_20261022.md',
          }
          assert changed==allowed,(changed-allowed,allowed-changed)
          source=Path('mapatrayectos/src/main/java/uy/com/mapatrayectos/conductorv0/ConductorV0Navigator.java').read_text()
          assert 'setListener(null)' in source
          assert 'sample-only' in source
          assert 'setPreviewMode(true)' in source
          assert "applicationId 'uy.com.mapatrayectos'" in Path('mapatrayectos/build.gradle').read_text()
          print('PASS Mapa QT native V0 mock-only, no second APK')
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9', cache-read-only: true}
      - name: Recuperar recursos y Android SDK
        run: |
          set -euo pipefail
          mkdir -p mapatrayectos/src/main/assets mapatrayectos/src/main/res/raw mapatrayectos/src/main/res/drawable-nodpi
          base64 -d mapatrayectos/assets/manrope.ttf.base64 > mapatrayectos/src/main/assets/manrope.ttf
          base64 -d mapatrayectos/assets/reminder_bubbles_elevenlabs.mp3.base64 > mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3
          base64 -d mapatrayectos/assets/logo_c_avatar.jpg.base64 > mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Restaurar certificado original de GitHub
        env:
          KEYSTORE_B64: ${{ secrets.TRASLADOS_SIGNING_KEYSTORE_B64 }}
          PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/traslados-release.jks"
          test -s "$RUNNER_TEMP/traslados-release.jks"
      - name: Compilar solamente Mapa QT release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/traslados-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: traslados-conductor
          ANDROID_KEY_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: gradle :mapatrayectos:assembleRelease --no-daemon --stacktrace
      - name: Verificar firma e identidad de actualización
        run: |
          set -euo pipefail
          APK="$(find mapatrayectos/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='uy.com.mapatrayectos' versionCode='85'" /tmp/badging.txt
          grep -q "application-label:'Mapa QT'" /tmp/badging.txt
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signing.txt
          grep -Eq 'Verified using v2 scheme.*true|Verified using v3 scheme.*true' /tmp/signing.txt
          sha256sum "$APK" | tee /tmp/hash.txt
          cp /tmp/signing.txt mapatrayectos/build/outputs/apk/release/SIGNING.txt
      - name: Conservar un único APK firmado en Actions
        uses: actions/upload-artifact@v4
        with:
          name: Mapa-QT-R25.32-ConductorV0-SIGNADA
          path: |
            mapatrayectos/build/outputs/apk/release/*.apk
            mapatrayectos/build/outputs/apk/release/SIGNING.txt
          if-no-files-found: error
          retention-days: 14
