      - name: Set v11.4 versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERSION'
          from pathlib import Path
          import re
          for module in ('cliente','conductor'):
              p=Path(module)/'build.gradle'
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'versionCode\s+\d+','versionCode 114',s,count=1)
              s=re.sub(r"versionName\s+'[^']+'","versionName '11.4'",s,count=1)
              p.write_text(s,encoding='utf-8')
          PYVERSION

      - name: Verify v11.4 source
        shell: bash
        run: |
          set -euo pipefail
          C=cliente/src/main/java/uy/com/traslados/cliente
          D=conductor/src/main/java/uy/com/traslados/conductor

          grep -q "versionCode 114" cliente/build.gradle
          grep -q "versionName '11.4'" cliente/build.gradle
          grep -q "versionCode 114" conductor/build.gradle
          grep -q "versionName '11.4'" conductor/build.gradle

          grep -q 'https://zetaudvvutlouiqxopvg.supabase.co' "$C/Api.java"
          grep -q 'https://zetaudvvutlouiqxopvg.supabase.co' "$D/Api.java"
          ! grep -q 'c--37e5ea75-667b-4c05-b55b-52dddb9e82f3-prod.lovable.cloud' "$C/Api.java"
          ! grep -q 'c--37e5ea75-667b-4c05-b55b-52dddb9e82f3-prod.lovable.cloud' "$D/Api.java"

          grep -q 'customer_get_available_slots_v11_4' "$C/MainActivity.java"
          grep -q 'customer_check_availability_v11_4' "$C/MainActivity.java"
          grep -q 'customer_create_reservation_v11_4' "$C/MainActivity.java"
          grep -q 'customer_quote_decision_v11_4' "$C/MainActivity.java"
          grep -q 'TRAVEL_TIME' "$C/MainActivity.java"
          grep -q 'p_origin_lat' "$C/MainActivity.java"
          grep -q 'p_destination_lat' "$C/MainActivity.java"
          grep -q 'llegada aprox' "$C/MainActivity.java"
          grep -q 'Precio total del traslado' "$C/MainActivity.java"

          grep -q 'driver_check_route_fit_v11_4' "$D/Api.java"
          grep -q 'checkRouteFitV114' "$D/MainActivity.java"
          grep -q 'PRECIO FINAL AL CLIENTE' "$D/MainActivity.java"
          grep -q 'referencia interna' "$D/MainActivity.java"
          grep -q 'GPS LISTO' "$D/MainActivity.java"
          grep -q 'WindowInsets.Type.ime()' "$C/MainActivity.java"
          grep -q 'WindowInsets.Type.ime()' "$D/MainActivity.java"
          grep -q 'TripTelemetryService' "$D/MainActivity.java"

          echo "v11.4 source checks OK"

      - name: Upload v11.4 patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-v11.4-supabase-patched-source
          path: |
            cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
            cliente/src/main/java/uy/com/traslados/cliente/Api.java
            cliente/src/main/java/uy/com/traslados/cliente/CustomerBubbleService.java
            conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
            conductor/src/main/java/uy/com/traslados/conductor/Api.java
            conductor/src/main/java/uy/com/traslados/conductor/ReservationMonitorService.java
            conductor/src/main/java/uy/com/traslados/conductor/TripTelemetryService.java
            conductor/src/main/AndroidManifest.xml
          if-no-files-found: error

      - name: Build Cliente and Conductor v11.4
        run: gradle :cliente:assembleDebug :conductor:assembleDebug --stacktrace

      - name: Prepare APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp cliente/build/outputs/apk/debug/cliente-debug.apk artifacts/Traslados_Cliente_v11.4_SUPABASE_TEST.apk
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor_v11.4_SUPABASE_TEST.apk
          sha256sum artifacts/*.apk
          ls -lh artifacts

      - name: Upload Cliente v11.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Cliente-v11.4-SUPABASE-TEST
          path: artifacts/Traslados_Cliente_v11.4_SUPABASE_TEST.apk
          if-no-files-found: error

      - name: Upload Conductor v11.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-SUPABASE-TEST
          path: artifacts/Traslados_Conductor_v11.4_SUPABASE_TEST.apk
          if-no-files-found: error
