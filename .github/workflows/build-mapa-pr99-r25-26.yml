name: Build Mapa R25.26 integrated Conductor signed draft
on:
  push:
    branches: [feature/tu-viaje-premium-visual-20261015]
    paths:
      - '.github/workflows/build-mapa-pr99-r25-26.yml'
      - 'mapatrayectos/build.gradle'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mapa-pr99-r25-26
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required Android SDK platform
        run: |
          ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify embedded Conductor source and old stable APK
        run: |
          grep -q "versionCode 78" mapatrayectos/build.gradle
          grep -q "versionName '0.1-R25.26'" mapatrayectos/build.gradle
          grep -q 'prepareEmbeddedConductor' mapatrayectos/build.gradle
          grep -q 'driver_decide_fixed_pickup_v1' conductor/src/main/java/uy/com/traslados/conductor/Api.java
          grep -q 'decideFixedRequest' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          test -s web-pasajero/downloads/mapa-trayectos-r25.25.apk
      - name: Restore permanent release signing
        env:
          KEYSTORE_B64: ${{ secrets.TRASLADOS_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mapa-pr99.jks"
          chmod 600 "$RUNNER_TEMP/mapa-pr99.jks"
      - name: Compile signed Mapa R25.26 with Conductor embedded
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mapa-pr99.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: traslados-conductor
          ANDROID_KEY_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: gradle :mapatrayectos:assembleRelease --no-daemon --stacktrace
      - name: Validate package, version and same original signing certificate
        run: |
          set -euo pipefail
          ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK="$(find mapatrayectos/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -s "$APK"
          "$ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > signing.txt
          grep -qi 'd91f4b9a37f4c77653fdf18fe792e7011a046dd2c09fded1e13fd29d4267269d' signing.txt
          "$ROOT/build-tools/35.0.0/aapt" dump badging "$APK" > apk-info.txt
          grep -q "package: name='uy.com.mapatrayectos'" apk-info.txt
          grep -q "versionCode='78'" apk-info.txt
          grep -q "versionName='0.1-R25.26'" apk-info.txt
          mkdir -p artifacts
          cp "$APK" artifacts/mapa-trayectos-pr99-r25.26-prueba.apk
          cp signing.txt apk-info.txt artifacts/
          (cd artifacts && sha256sum *.apk > MAPA-R25.26-SHA256SUMS.txt)
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > artifacts/BUILT_AT_UTC.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mapa-Trayectos-PR99-R25-26-Firmada
          path: artifacts/
          retention-days: 30
      - name: Publish ONLY on draft branch; leave public R25.25 unmodified
        run: |
          set -euo pipefail
          git config user.name 'Traslados Mapa Draft CI'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin feature/tu-viaje-premium-visual-20261015
            git reset --hard origin/feature/tu-viaje-premium-visual-20261015
            mkdir -p preview-artifacts
            cp artifacts/mapa-trayectos-pr99-r25.26-prueba.apk preview-artifacts/
            cp artifacts/MAPA-R25.26-SHA256SUMS.txt preview-artifacts/
            git add preview-artifacts/mapa-trayectos-pr99-r25.26-prueba.apk preview-artifacts/MAPA-R25.26-SHA256SUMS.txt
            git diff --cached --quiet && exit 0
            git commit -m 'APK Mapa Trayectos R25.26 integrada firmada en rama draft'
            if git push origin HEAD:feature/tu-viaje-premium-visual-20261015; then exit 0; fi
          done
          exit 1
