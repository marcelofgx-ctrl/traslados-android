# Firma RELEASE permanente de Traslados Conductor.
# La clave privada y su contraseña NUNCA viven en el repositorio.
# Secretos requeridos:
#   TRASLADOS_SIGNING_KEYSTORE_B64
#   TRASLADOS_SIGNING_PASSWORD

name: Build Traslados Conductor RELEASE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'conductor/**'
      - '.github/workflows/build-conductor-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_KEY_ALIAS: traslados-conductor
      EXPECTED_CERT_SHA256: d91f4b9a37f4c77653fdf18fe792e7011a046dd2c09fded1e13fd29d4267269d

    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release signing key securely
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TRASLADOS_SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${SIGNING_PASSWORD:-}" ]; then
            echo 'Required signing secrets are missing.' >&2
            exit 2
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/traslados-conductor-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify signing certificate before build
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_CERT_SHA256="$(
            keytool -exportcert -rfc \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
            | openssl x509 -noout -fingerprint -sha256 \
            | sed 's/^.*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]'
          )"
          echo "Release certificate SHA-256: $ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Verify canonical Conductor source
        shell: bash
        run: |
          set -euo pipefail
          test -f conductor/build.gradle
          test -f conductor/src/main/AndroidManifest.xml
          test -f conductor/src/main/java/uy/com/traslados/conductor/DemandMapActivity.java
          grep -q "applicationId 'uy.com.traslados.conductor'" conductor/build.gradle
          grep -q "versionCode 123" conductor/build.gradle
          grep -q "versionName '11.5-R1'" conductor/build.gradle
          grep -q "org.maplibre.gl:android-sdk:13.6.1" conductor/build.gradle
          grep -q "DemandMapActivity" conductor/src/main/AndroidManifest.xml
          grep -q "signingConfigs" conductor/build.gradle
          grep -q "ANDROID_KEYSTORE_PATH" conductor/build.gradle
          grep -q "ANDROID_KEYSTORE_PASSWORD" conductor/build.gradle

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :conductor:assembleRelease --stacktrace

      - name: Verify APK signature and signer identity
        shell: bash
        run: |
          set -euo pipefail
          APK='conductor/build/outputs/apk/release/conductor-release.apk'
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_CERT_SHA256="$(
            "$APKSIGNER" verify --print-certs "$APK" \
            | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' \
            | tr '[:upper:]' '[:lower:]'
          )"
          echo "APK signer SHA-256: $APK_CERT_SHA256"
          test "$APK_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Prepare signed artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp conductor/build/outputs/apk/release/conductor-release.apk \
            artifacts/Traslados_Conductor_v11.5_R1_MAPA_BETA_RELEASE.apk
          sha256sum artifacts/Traslados_Conductor_v11.5_R1_MAPA_BETA_RELEASE.apk \
            | tee artifacts/SHA256SUMS.txt
          printf '%s\n' "$EXPECTED_CERT_SHA256" > artifacts/SIGNING_CERT_SHA256.txt
          ls -lh artifacts/Traslados_Conductor_v11.5_R1_MAPA_BETA_RELEASE.apk \
            artifacts/SHA256SUMS.txt artifacts/SIGNING_CERT_SHA256.txt

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v11.5-R1-MAPA-BETA-RELEASE
          path: |
            artifacts/Traslados_Conductor_v11.5_R1_MAPA_BETA_RELEASE.apk
            artifacts/SHA256SUMS.txt
            artifacts/SIGNING_CERT_SHA256.txt
          if-no-files-found: error
          retention-days: 90
