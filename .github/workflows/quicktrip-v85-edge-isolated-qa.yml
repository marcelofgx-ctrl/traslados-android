name: Quick Trip v85 - QA Casos Limite (SIN DEPLOY / SIN SUPABASE)
# Segundo pase: registrar diferencias de cache sin alterar codigo de la PWA.
on:
  push:
    branches:
      - qa/quicktrip-v85-casos-limite-20261024
    paths:
      - .github/workflows/quicktrip-v85-edge-isolated-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-edge-in-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Proteger version v85: ningun motor, Android o produccion modificado"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base='74349827ddf7ce9ee7293571b1c7b32940e309cc'
          changed=set(subprocess.check_output(['git','diff','--name-only',base+'..HEAD'],text=True).splitlines())
          approved={
             'web-pasajero/tests/quicktrip-v85-cache-rollback-isolated.cjs',
             'web-pasajero/tests/quicktrip-v85-browser-edge-isolated.cjs',
             '.github/workflows/quicktrip-v85-edge-isolated-qa.yml'
          }
          assert changed==approved,('Unexpected changes',sorted(changed-approved),'Missing',sorted(approved-changed))
          print('PASS: solo nuevas pruebas QA; binarios, PWA, Supabase, GPS y reservas NO tocados')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Regresiones existentes: reservas, ETA, buscador, rutas"
        shell: bash
        run: |
          set -euo pipefail
          node --check web-pasajero/tests/quicktrip-v85-browser-edge-isolated.cjs
          node --check web-pasajero/tests/quicktrip-v85-cache-rollback-isolated.cjs
          node web-pasajero/tests/booking-contracts-smoke.cjs
          node web-pasajero/tests/urgent-request-v49-smoke.cjs
          node web-pasajero/tests/route-engine-smoke.cjs
          node web-pasajero/tests/eta-engine-smoke.cjs
          node web-pasajero/tests/search-smoke.cjs
          node web-pasajero/tests/address-picker-regression-v82-smoke.cjs
          node web-pasajero/tests/reservation-live-v82-smoke.cjs
          node web-pasajero/tests/quicktrip-three-services-v84-smoke.cjs
          node web-pasajero/tests/quicktrip-mobile-skin-v83-smoke.cjs
      - name: "CacheStorage y Service Worker REALES en memoria, sin red"
        env:
          QA_DIR: ${{ github.workspace }}/quicktrip-v85-edge-qa
        run: |
          set -euo pipefail
          node web-pasajero/tests/quicktrip-v85-cache-rollback-isolated.cjs
      - name: Chromium original del runner sin acceso backend real
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH" || { echo 'Chromium no instalado'; exit 1; }
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --prefix /tmp/quicktrip-v85-edge --no-save --no-audit --no-fund playwright-core@1.56.1
          echo "NODE_PATH=/tmp/quicktrip-v85-edge/node_modules" >> "$GITHUB_ENV"
      - name: "Navegacion, borrador, desconexion, fallo y reservas duplicadas"
        env:
          QA_DIR: ${{ github.workspace }}/quicktrip-v85-edge-qa
        run: |
          set -euo pipefail
          node web-pasajero/tests/quicktrip-v85-browser-edge-isolated.cjs
      - name: Adjuntar hallazgos y capturas - JAMAS PUBLICAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuickTrip-v85-Casos-Limite-Evidencia-NoPublicada
          path: quicktrip-v85-edge-qa/
          if-no-files-found: warn
          retention-days: 14
