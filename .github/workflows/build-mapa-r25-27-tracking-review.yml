name: Mapa R25.27 private ride GPS — signed review (no main)
on:
  push:
    branches: [feature/mapa-gps-reserva-20261017]
    paths:
      - '.github/workflows/build-mapa-r25-27-tracking-review.yml'
      - 'mapatrayectos/src/**'
      - 'mapatrayectos/build.gradle'
      - 'scripts/test_mapa_datos.py'
      - 'core-reservations/**'
      - 'conductor/src/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mapa-r25-27-private-ride-review
  cancel-in-progress: false
jobs:
  signed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify no GPS purges, secure private tracking and local backups
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_mapa_datos.py
          grep -q 'mapa_reservation_position_v1' mapatrayectos/src/main/java/uy/com/mapatrayectos/Api.java
          grep -q 'publishPickupPresence' mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q 'reservation_live_position enable row level security' supabase/migrations/20261017190000_private_reservation_live_tracking_v1.sql
          grep -q 'customer_reservation_position_v1' supabase/migrations/20261017190000_private_reservation_live_tracking_v1.sql
          ! grep -Ei 'delete from|truncate table|drop table' supabase/migrations/20261017190000_private_reservation_live_tracking_v1.sql
      - name: Build review with same package + next versionCode 79
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mapatrayectos/build.gradle');s=p.read_text()
          assert s.count("applicationId 'uy.com.mapatrayectos'")==1
          assert s.count('versionCode 77')==1
          assert s.count("versionName '0.1-R25.25'")==1
          p.write_text(s.replace('versionCode 77','versionCode 79').replace("versionName '0.1-R25.25'","versionName '0.1-R25.27'"))
          print('PASS: original Mapa package, code79 > R25.26/code78')
          PY
      - name: Decode exact historical icons/fonts/alerts (no changes)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mapatrayectos/src/main/res/drawable-nodpi mapatrayectos/src/main/res/raw mapatrayectos/src/main/assets
          base64 -d mapatrayectos/assets/logo_c_avatar.jpg.base64 > mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg
          base64 -d mapatrayectos/assets/reminder_bubbles_elevenlabs.mp3.base64 > mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3
          base64 -d mapatrayectos/assets/manrope.ttf.base64 > mapatrayectos/src/main/assets/manrope.ttf
          echo 'a71f22c701189b3f0ef90a5405a285246e3d8ab80ffe2a528e01b19273737c15  mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg' | sha256sum -c
          echo '5cc7d452cb5f265bf6544486c52f3e8b57d3a292e77af38cbb5e3df0e9875bb0  mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3' | sha256sum -c
          test "$(git hash-object mapatrayectos/src/main/assets/manrope.ttf)" = '75274da58537d6123b14f2cd0c355ad4681fc2b3'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Recover same permanent release signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TRASLADOS_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
      - name: Compile signed RELEASE for original Mapa Android ID
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: traslados-conductor
          ANDROID_KEY_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: gradle :mapatrayectos:assembleRelease --no-daemon --console=plain --stacktrace
      - name: Verify same signature vs R25.26 and embedded private-tracking Java
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APK=mapatrayectos/build/outputs/apk/release/mapatrayectos-release.apk
          mkdir -p artifacts /tmp/mapa-base
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > artifacts/SIGNING.txt
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" > artifacts/APK_INFO.txt
          gh release download mapa-r25.26-compatible-review-20261017 -p 'Mapa_Trayectos_R25_26_Datos_Compatible_REVIEW.apk' -D /tmp/mapa-base
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs /tmp/mapa-base/*.apk > /tmp/mapa-old-cert.txt
          python3 - <<'PY'
          import re,zipfile
          from pathlib import Path
          info=Path('artifacts/APK_INFO.txt').read_text()
          assert "package: name='uy.com.mapatrayectos' versionCode='79' versionName='0.1-R25.27'" in info,info[:260]
          def digest(p):
            m=re.search(r'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})',Path(p).read_text())
            assert m,'Missing signer'
            return m.group(1).lower()
          assert digest('artifacts/SIGNING.txt')==digest('/tmp/mapa-old-cert.txt'),'CRITICAL signing mismatch'
          a='mapatrayectos/build/outputs/apk/release/mapatrayectos-release.apk'
          with zipfile.ZipFile(a) as apk:
            assert any(name.endswith('classes.dex') for name in apk.namelist())
            assert apk.testzip() is None
          print('PASS: valid signed Mapa APK, same package/signature, 79 > 78')
          PY
          cp "$APK" artifacts/Mapa_Trayectos_R25_27_Seguimiento_Privado_REVIEW.apk
          (cd artifacts && sha256sum Mapa_Trayectos_R25_27_Seguimiento_Privado_REVIEW.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          date -u +'%Y-%m-%dT%H:%M:%SZ' > artifacts/BUILT_AT_UTC.txt
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mapa-R25-27-Seguimiento-SIGNED
          path: artifacts/
          if-no-files-found: error
          retention-days: 60
      - name: Publish prerelease QA APK, never overwrite passenger downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=mapa-r25.27-seguimiento-privado-review-20261017
          APK=artifacts/Mapa_Trayectos_R25_27_Seguimiento_Privado_REVIEW.apk
          NOTES='REVIEW únicamente. APK oficial uy.com.mapatrayectos, versionCode 79, firma idéntica a R25.26 y compatible con actualización sin segundo icono. Mantiene GPS histórico y exportaciones. Nuevo GPS de reserva solo con consentimiento actual de presencia y una única reserva activa EN_CAMINO o EN_VIAJE; la posición es consultable solo por pasajero autorizado y se invalida a los 75 s. Conservá backup ZIP; requiere Cliente v18 para visualización.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" artifacts/SHA256SUMS.txt artifacts/APK_INFO.txt artifacts/SIGNING.txt --clobber
          else
            gh release create "$TAG" "$APK" artifacts/SHA256SUMS.txt artifacts/APK_INFO.txt artifacts/SIGNING.txt --target "$GITHUB_SHA" --title 'Mapa R25.27 · Seguimiento privado (PRUEBA)' --notes "$NOTES" --prerelease
          fi
          mkdir -p /tmp/recheck
          gh release download "$TAG" -p 'Mapa_Trayectos_R25_27_Seguimiento_Privado_REVIEW.apk' -D /tmp/recheck
          cmp "$APK" /tmp/recheck/*.apk
          echo 'PASS: available signed review APK matches GitHub release bytes'
