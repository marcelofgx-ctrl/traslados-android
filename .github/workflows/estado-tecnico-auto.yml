name: Actualizar estado técnico Traslados (sin compilar)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/estado_traslados.py'
      - 'tests/test_estado_traslados.py'
      - '.github/workflows/estado-tecnico-auto.yml'
  workflow_run:
    workflows:
      - Verify and package passenger PWA (GitHub Pages via branch)
      - Build Mapa Trayectos RELEASE
      - Quick Trip V7 - APKs de testing
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: traslados-autoestado-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/estado_traslados.py
            /tests/test_estado_traslados.py
      - name: Probar lectura de versiones y seguridad sin conexión
        run: python3 -m unittest discover -s tests -p 'test_estado_traslados.py'
  report:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout mínimo de código y contexto
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/estado_traslados.py
            /tests/test_estado_traslados.py
            /conductor/build.gradle
            /mapatrayectos/build.gradle
            /cliente-premium/app/build.gradle
            /web-pasajero/sw.js
            /docs/ESTADO_AUTOMATICO_TRASLADOS.md

      - name: Probar seguridad y coherencia del estado
        run: python3 -m unittest discover -s tests -p 'test_estado_traslados.py'

      - name: Escribir estado técnico sin compilar nada
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/estado_traslados.py --root .

      - name: Dejar frase de reanudación en resumen de GitHub
        shell: bash
        run: |
          echo '### Continuar Traslados en ChatGPT' >> "$GITHUB_STEP_SUMMARY"
          echo 'Copiar: **Retomar Traslados Web desde Git**' >> "$GITHUB_STEP_SUMMARY"
          echo 'Primero consultar fechas/horas UYT de última compilación y último cambio en el estado automático.' >> "$GITHUB_STEP_SUMMARY"

      - name: Entregar estado como artefacto, sin commits ni cascadas
        uses: actions/upload-artifact@v4
        with:
          name: quicktrip-estado-tecnico
          path: docs/ESTADO_AUTOMATICO_TRASLADOS.md
          retention-days: 14
          if-no-files-found: error
