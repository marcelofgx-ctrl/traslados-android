              t=i/rate;v=0.0
              for a,b,f,amp in tones:
                  if a<=t<b:
                      x=(t-a)/(b-a);env=min(1.0,x*8.0)*max(0.0,1.0-x*x);v+=amp*env*math.sin(2*math.pi*f*t)
