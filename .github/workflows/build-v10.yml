      - name: Set v10 versions and normalize client headers
        shell: bash
        run: |
          python3 - <<'PYVERSION'
          from pathlib import Path
          import re

          for module in ('cliente','conductor'):
              p=Path(module)/'build.gradle'
              s=p.read_text()
              s=re.sub(r'versionCode\s+\d+', 'versionCode 100', s, count=1)
              s=re.sub(r"versionName\s+'[^']+'", "versionName '10.0'", s, count=1)
              p.write_text(s)

          p=Path('cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java')
          s=p.read_text(); s=re.sub(r'Cliente v\d+(?:\.\d+)+ iniciado','Cliente v10 iniciado',s); p.write_text(s)
          p=Path('conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java')
          s=p.read_text(); s=re.sub(r'Conductor v\d+(?:\.\d+)+ iniciado','Conductor v10 iniciado',s); p.write_text(s)

          p=Path('cliente/src/main/java/uy/com/traslados/cliente/Api.java')
          s=p.read_text(); s=re.sub(r'TrasladosConReserva/\d+(?:\.\d+)+','TrasladosConReserva/10.0',s); s=re.sub(r'b\.put\("p_app_version","[^"]+"\)', 'b.put("p_app_version","10.0")', s); p.write_text(s)
          p=Path('conductor/src/main/java/uy/com/traslados/conductor/Api.java')
          s=p.read_text(); s=re.sub(r'traslados-conductor-android/\d+(?:\.\d+)+','traslados-conductor-android/10.0',s); s=re.sub(r'b\.put\("p_app_version","[^"]+"\)', 'b.put("p_app_version","10.0")', s); p.write_text(s)
          PYVERSION

      - name: Verify v10 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '10.0'" cliente/build.gradle
          grep -q "versionName '10.0'" conductor/build.gradle
          grep -q 'customer_create_reservation_v10' cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q 'customer_quote_decision_v10' cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java
          grep -q 'routeEstimate' cliente/src/main/java/uy/com/traslados/cliente/Api.java
          grep -q 'PREPARAR PRESUPUESTO' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'agendaMode' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'driver_send_quote_v10' conductor/src/main/java/uy/com/traslados/conductor/Api.java
          test -s conductor/src/main/res/raw/reserva_calida.wav
          echo "Fuente v10 verificada"

      - name: Build Cliente and Conductor v10
        run: gradle :cliente:assembleDebug :conductor:assembleDebug --stacktrace

      - name: Prepare APKs
        shell: bash
        run: |
          mkdir -p artifacts
          cp cliente/build/outputs/apk/debug/cliente-debug.apk artifacts/Traslados_Cliente_v10.apk
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor_v10.apk
          sha256sum artifacts/*.apk
          ls -lh artifacts

      - name: Upload Cliente v10 APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Cliente-v10
          path: artifacts/Traslados_Cliente_v10.apk
          if-no-files-found: error

      - name: Upload Conductor v10 APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v10
          path: artifacts/Traslados_Conductor_v10.apk
          if-no-files-found: error
