name: Traslados Web — Compilación independiente

on:
  push:
    branches:
      - web-traslados-rescate-20261008
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar-web:
    name: Probar Lovable exportado + Cloudflare independiente
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://xetklwcxebcpnkrdrmaa.supabase.co
      SUPABASE_URL: https://xetklwcxebcpnkrdrmaa.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: build-only-test-key
      SUPABASE_PUBLISHABLE_KEY: build-only-test-key
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Dependencias originales
        run: bun install --frozen-lockfile
      - name: Compilar código exportado
        run: bun run build
      - name: Instalar plugin Cloudflare oficial sin créditos Lovable
        run: bun add -d @cloudflare/vite-plugin wrangler
      - name: Compilar con configuración Cloudflare (sin wrapper Lovable)
        run: bunx vite build --config vite.cloudflare.config.ts
      - name: Guardar artefacto de compilación
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: traslados-web-cloudflare
          path: |
            dist/
            .output/
          if-no-files-found: warn
          retention-days: 7
