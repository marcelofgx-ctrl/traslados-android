name: Comprobar web pública de Traslados Pasajero

# Se comprueba DESPUÉS de terminar Pages, no en un push antes de publicarse.
# Comprobar únicamente cuando Pages completó; evita 'rojo' por propagación.
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Revisar índice y acceso independiente del pasajero
        shell: bash
        run: |
          set -euo pipefail
          url="https://marcelofgx-ctrl.github.io/traslados-android/"
          for i in 1 2 3 4 5 6; do
            curl -fsSL --max-time 25 "$url?ci=$GITHUB_RUN_ID" -o /tmp/traslados-index.html || true
            if grep -q 'href="./web-pasajero/"' /tmp/traslados-index.html 2>/dev/null; then break; fi
            echo "Esperando índice estable ($i/6)"
            sleep 12
          done
          grep -q 'href="./web-pasajero/"' /tmp/traslados-index.html
          grep -q 'índice estable del proyecto' /tmp/traslados-index.html
          echo "Índice estable publicado con acceso a la PWA de pasajeros."
      - name: Revisar HTML y motor publicado
        shell: bash
        run: |
          set -euo pipefail
          base="https://marcelofgx-ctrl.github.io/traslados-android/web-pasajero"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 25 -o /tmp/traslados.html "$base/?ci=$GITHUB_RUN_ID"; then
              if grep -q 'app.js?v=10' /tmp/traslados.html; then break; fi
            fi
            echo "Esperando versión publicada ($i/6)"
            sleep 12
          done
          grep -q 'app.js?v=10' /tmp/traslados.html
          grep -q 'id="route-overview"' /tmp/traslados.html
          grep -q 'ENVIAR SOLICITUD AL CONDUCTOR' /tmp/traslados.html
          curl -fsSL --max-time 25 "$base/geo-search.js?v=3&ci=$GITHUB_RUN_ID" -o /tmp/geo.js
          curl -fsSL --max-time 25 "$base/app.js?v=10&ci=$GITHUB_RUN_ID" -o /tmp/app.js
          grep -q 'uy-airport-carrasco' /tmp/geo.js
          grep -q 'function renderRouteSummary()' /tmp/app.js
          grep -q 'route-estimate' /tmp/app.js
          node --check /tmp/app.js
          grep -q 'referenceFareUyu' /tmp/app.js
          grep -q 'public_cached_route_preview_v1' /tmp/app.js
          grep -q 'PRECIO ORIENTATIVO' /tmp/app.js
          grep -q 'route-compact-path' /tmp/app.js
          ! grep -q 'distance.textContent="Ver en Maps"' /tmp/app.js
          grep -q 'function showPreview()' /tmp/app.js
          grep -q 'function mapsLinkFromBooking(' /tmp/app.js
          echo "HTML, Aeropuerto Carrasco, km/min, Maps y motor OSM publicados."
      - name: Diagnosticar motor de ruta compartido y tarifa sin inventar resultados
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://traslados-web.marcelof-gx.workers.dev/api/public/route-estimate?points=-56.016380%2C-34.836960%3B-56.180000%2C-34.900000'
          status="$(curl -sSL --max-time 18 -o /tmp/route-runtime.json -w '%{http_code}' "$endpoint" || true)"
          echo "Cloudflare ruta pública: HTTP $status"
          python3 - <<'PY'
          import json
          try:
            with open("/tmp/route-runtime.json",encoding="utf8") as f:data=json.load(f)
          except Exception:
            print("Estado: sin JSON público verificable")
            raise SystemExit(0)
          print("Motor disponible:",bool(data.get("available")))
          print("Motivo de indisponibilidad:",data.get("reason","ninguno"))
          print("Trae tarifa orientativa del Worker:",isinstance(data.get("referenceFareUyu"),(int,float)))
          print("No se inspeccionan ni registran secretos.")
          PY
      - name: Revisar datos nacionales publicados
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 3 --max-time 45 \
            "https://marcelofgx-ctrl.github.io/traslados-android/web-pasajero/data/uy-pois.json" \
            -o /tmp/uy-pois.json
          python3 - <<'PY'
          import json
          with open('/tmp/uy-pois.json',encoding='utf8') as f:
              index=json.load(f)
          assert index.get('version')==1
          names=[x[1].lower() for x in index['items']]
          assert len(names)>5000, 'No hay índice completo'
          assert any('punta carretas shopping' in x for x in names), 'Falta Punta Carretas'
          assert any('plaza italia shopping' in x for x in names), 'Falta Plaza Italia'
          print(f"Web publicada OK: {len(names)} comercios/lugares OSM de Uruguay")
          PY
