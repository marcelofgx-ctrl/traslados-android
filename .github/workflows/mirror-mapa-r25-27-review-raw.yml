name: Mirror signed Mapa R25.27 QA APK (direct Samsung download)
on:
  push:
    branches: [feature/mapa-gps-reserva-20261017]
    paths: ['.github/workflows/mirror-mapa-r25-27-review-raw.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror-mapa-r25-27-only
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate signed release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILE=Mapa_Trayectos_R25_27_Seguimiento_Privado_REVIEW.apk
          mkdir -p /tmp/mapa-validado
          gh release download mapa-r25.27-seguimiento-privado-review-20261017 -p "$FILE" -p SHA256SUMS.txt -D /tmp/mapa-validado
          (cd /tmp/mapa-validado && sha256sum -c SHA256SUMS.txt)
          test "$(stat -c %s "/tmp/mapa-validado/$FILE")" -gt 50000000
          file "/tmp/mapa-validado/$FILE"
      - name: Copy verified QA artifact only to Mapa review branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=feature/mapa-gps-reserva-20261017
          FILE=Mapa_Trayectos_R25_27_Seguimiento_Privado_REVIEW.apk
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p preview-artifacts
          cp "/tmp/mapa-validado/$FILE" preview-artifacts/
          (cd preview-artifacts && sha256sum "$FILE" > MAPA-R25.27-SHA256SUMS.txt && sha256sum -c MAPA-R25.27-SHA256SUMS.txt)
          git config user.name 'Traslados QA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add "preview-artifacts/$FILE" preview-artifacts/MAPA-R25.27-SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa: mirror signed Mapa R25.27 APK for direct mobile download'
          git push origin "HEAD:$BRANCH"
