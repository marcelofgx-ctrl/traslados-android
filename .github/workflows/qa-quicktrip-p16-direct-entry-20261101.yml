name: QA Quick Trip P1.6 — entrada directa sin landing (NO RELEASE)
on:
  push:
    branches:
      - qa/quicktrip-p16-direct-entry-20261101
permissions:
  contents: read
jobs:
  root-passenger-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Strict QA-only scope
        run: |
          set -euo pipefail
          BASE=ee22375f00dc9f71cb3ca633aafe06adce862aec
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          mapfile -t changed < <(git diff --name-only "$BASE"..HEAD | LC_ALL=C sort)
          test "${#changed[@]}" -eq 4
          for f in "${changed[@]}"; do
            case "$f" in
              index.html|.github/workflows/qa-quicktrip-p16-direct-entry-20261101.yml|tests/quicktrip-p16-direct-entry-contract.cjs|docs/QA_QUICKTRIP_P16_DIRECT_ENTRY_20261101.md) ;;
              *) echo "UNEXPECTED FILE $f"; exit 1 ;;
            esac
          done
          git diff --quiet "$BASE"..HEAD -- web-pasajero/ mapatrayectos/ supabase/ android/ backend/ 
          node --check tests/quicktrip-p16-direct-entry-contract.cjs
      - name: Direct entry and existing P1.4/P1.6 regression
        run: |
          set -euo pipefail
          node tests/quicktrip-p16-direct-entry-contract.cjs
          node tests/quicktrip-p14-approved-contract.cjs
          node tests/quicktrip-p14-baseline-regression.cjs
          node tests/quicktrip-p14-photo1-contract.cjs
          node tests/quicktrip-p14-auto-map-contract.cjs
          node tests/quicktrip-p16-motion-contract.cjs
