      - name: Set v11.1 versions and normalize client headers
        shell: bash
        run: |
          python3 - <<'PYVERSION'
          from pathlib import Path
          import re

          for module in ('cliente','conductor'):
              p=Path(module)/'build.gradle'
              s=p.read_text()
              s=re.sub(r'versionCode\s+\d+', 'versionCode 111', s, count=1)
              s=re.sub(r"versionName\s+'[^']+'", "versionName '11.1'", s, count=1)
              p.write_text(s)

          p=Path('cliente/src/main/java/uy/com/traslados/cliente/MainActivity.java')
          s=p.read_text(); s=re.sub(r'Cliente v\d+(?:\.\d+)+ iniciado','Cliente v11.1 iniciado',s); p.write_text(s)
          p=Path('conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java')
          s=p.read_text(); s=re.sub(r'Conductor v\d+(?:\.\d+)+ iniciado','Conductor v11.1 iniciado',s); s=re.sub(r'VERSIÓN\s+\d+(?:\.\d+)+','V11.1',s); p.write_text(s)

          p=Path('cliente/src/main/java/uy/com/traslados/cliente/Api.java')
          s=p.read_text(); s=re.sub(r'TrasladosConReserva/\d+(?:\.\d+)+','TrasladosConReserva/11.1',s); s=re.sub(r'b\.put\("p_app_version","[^"]+"\)', 'b.put("p_app_version","11.1")', s); p.write_text(s)
          p=Path('conductor/src/main/java/uy/com/traslados/conductor/Api.java')
          s=p.read_text(); s=re.sub(r'traslados-conductor-android/\d+(?:\.\d+)+','traslados-conductor-android/11.1',s); s=re.sub(r'b\.put\("p_app_version","[^"]+"\)', 'b.put("p_app_version","11.1")', s); p.write_text(s)
          PYVERSION

