# ACTUALIZADO: 2026-10-05
# OBJETIVO: materializar y verificar en Git la fuente exacta de Conductor R10.2 FIX
# ORIGEN FUENTE: artifact del run verde 37126836138

name: Bootstrap canonical Traslados Conductor R10.2

on:
  workflow_dispatch:
  push:
    branches:
      - 'stabilize/conductor-r10.2-canonical'
    paths:
      - '.github/workflows/bootstrap-conductor-canonical.yml'

permissions:
  contents: write
  actions: read

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact successful R10.2 source snapshot
        uses: actions/download-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-R10.2-patched-source
          path: /tmp/r102src
          github-token: ${{ github.token }}
          repository: marcelofgx-ctrl/traslados-android
          run-id: 37126836138

      - name: Verify and preserve canonical source
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/r102src/build.gradle
          test -f /tmp/r102src/src/main/AndroidManifest.xml
          D=/tmp/r102src/src/main/java/uy/com/traslados/conductor
          test -f "$D/MainActivity.java"
          test -f "$D/Api.java"
          test -f "$D/ReservationMonitorService.java"
          test -f "$D/TripTelemetryService.java"
          grep -q "versionCode 120" /tmp/r102src/build.gradle
          grep -q "versionName '11.4-R10.2'" /tmp/r102src/build.gradle
          grep -q '11.4-R10.2' "$D/Api.java"
          grep -q 'Conductor v11.4 R10.2 iniciado' "$D/MainActivity.java"
          grep -q 'indicador de expansión premium' "$D/MainActivity.java"
          grep -q 'collapseAllOtherDays' "$D/MainActivity.java"
          grep -q 'WindowInsets' "$D/MainActivity.java"
          grep -q 'TripTelemetryService' "$D/MainActivity.java"
          grep -q 'driverNewReservationCueOnce' "$D/ReservationMonitorService.java"
          ! grep -q 'new AlertDialog.Builder' "$D/MainActivity.java"
          rm -rf /tmp/canonical-conductor
          mkdir -p /tmp/canonical-conductor
          cp -a /tmp/r102src/. /tmp/canonical-conductor/
          echo 'Snapshot R10.2 validado y preservado'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android scaffold and legacy resources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/c059c89bac5a5ebb423176af474134a289f88418/.github/workflows/build-apks.yml" -o /tmp/base-v4.yml
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/d819c60656fe1934be9d6aa31eefdea7beb041be/.github/workflows/build-conductor.yml" -o /tmp/conductor-v9.2.yml

          python3 - <<'PYRESTORE'
          import base64, io, re, tarfile
          from pathlib import Path

          base=Path('/tmp/base-v4.yml').read_text(encoding='utf-8')
          m=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| tar -xz",base)
          if not m:
              raise SystemExit('No se encontró proyecto Android base')
          raw=base64.b64decode(m.group(1),validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              tf.extractall('.')

          txt=Path('/tmp/conductor-v9.2.yml').read_text(encoding='utf-8')
          m=re.search(r"payload\s*=\s*\(([\s\S]*?)\n\s*\)",txt)
          if not m:
              raise SystemExit('No se encontró payload Conductor v9.2')
          pieces=re.findall(r'"([A-Za-z0-9+/=]+)"',m.group(1))
          if not pieces:
              raise SystemExit('Payload vacío Conductor v9.2')
          raw=base64.b64decode(''.join(pieces),validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              tf.extractall('.')
          print('Scaffold Android y recursos legacy restaurados')
          PYRESTORE

          test -d conductor
          grep -q "versionName '9.2'" conductor/build.gradle

      - name: Overlay canonical R10.2 source
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/canonical-conductor/. conductor/
          grep -q "versionName '11.4-R10.2'" conductor/build.gradle

      - name: Download exact R10.2 APK for audio resources
        uses: actions/download-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-R10.2
          path: /tmp/r102apk
          github-token: ${{ github.token }}
          repository: marcelofgx-ctrl/traslados-android
          run-id: 37126836138

      - name: Restore exact R10.2 audio resources
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/r102apk -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p conductor/src/main/res/raw /tmp/r102raw
          unzip -j -o "$APK" 'res/raw/reserva_calida.wav' 'res/raw/viaje_proximo.wav' -d /tmp/r102raw
          cp /tmp/r102raw/reserva_calida.wav conductor/src/main/res/raw/reserva_calida.wav
          cp /tmp/r102raw/viaje_proximo.wav conductor/src/main/res/raw/viaje_proximo.wav
          test -s conductor/src/main/res/raw/reserva_calida.wav
          test -s conductor/src/main/res/raw/viaje_proximo.wav

      - name: Build exact canonical R10.2
        run: gradle :conductor:assembleDebug --stacktrace

      - name: Prepare verified APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor_v11.4_R10.2_CANONICAL.apk
          sha256sum artifacts/Traslados_Conductor_v11.4_R10.2_CANONICAL.apk | tee artifacts/SHA256SUMS.txt
          ls -lh artifacts/Traslados_Conductor_v11.4_R10.2_CANONICAL.apk artifacts/SHA256SUMS.txt

      - name: Upload verified canonical APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-R10.2-CANONICAL
          path: |
            artifacts/Traslados_Conductor_v11.4_R10.2_CANONICAL.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Commit verified R10.2 source into stabilization branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p conductor/src/main/java/uy/com/traslados/conductor
          cp /tmp/canonical-conductor/build.gradle conductor/build.gradle
          cp /tmp/canonical-conductor/src/main/AndroidManifest.xml conductor/src/main/AndroidManifest.xml
          cp /tmp/canonical-conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          cp /tmp/canonical-conductor/src/main/java/uy/com/traslados/conductor/Api.java conductor/src/main/java/uy/com/traslados/conductor/Api.java
          cp /tmp/canonical-conductor/src/main/java/uy/com/traslados/conductor/ReservationMonitorService.java conductor/src/main/java/uy/com/traslados/conductor/ReservationMonitorService.java
          cp /tmp/canonical-conductor/src/main/java/uy/com/traslados/conductor/TripTelemetryService.java conductor/src/main/java/uy/com/traslados/conductor/TripTelemetryService.java

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            conductor/build.gradle \
            conductor/src/main/AndroidManifest.xml \
            conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java \
            conductor/src/main/java/uy/com/traslados/conductor/Api.java \
            conductor/src/main/java/uy/com/traslados/conductor/ReservationMonitorService.java \
            conductor/src/main/java/uy/com/traslados/conductor/TripTelemetryService.java

          if git diff --cached --quiet; then
            echo 'La fuente canónica ya estaba versionada; no hay cambios para commit.'
          else
            git commit -m 'Canonicalize Traslados Conductor v11.4 R10.2 source'
            git push origin HEAD:stabilize/conductor-r10.2-canonical
          fi
