name: Build Conductor mosaic R10 signed draft
on:
  push:
    branches: [feature/mapa-driver-mosaico-modular-20261016]
    paths:
      - 'conductor/**'
      - 'feature/driver/**'
      - '.github/workflows/build-conductor-mosaic-r10.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conductor-pr109-r10
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android platform
        run: |
          ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.TRASLADOS_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/traslados-r10.jks"
          chmod 600 "$RUNNER_TEMP/traslados-r10.jks"
      - name: Compile R10 using existing signing identity
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/traslados-r10.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: traslados-conductor
          ANDROID_KEY_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: gradle :conductor:assembleRelease --no-daemon --stacktrace
      - name: Verify APK version and original signer
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK=conductor/build/outputs/apk/release/conductor-release.apk
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > signing.txt
          grep -qi 'd91f4b9a37f4c77653fdf18fe792e7011a046dd2c09fded1e13fd29d4267269d' signing.txt
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" > apk-info.txt
          grep -q "versionCode='132'" apk-info.txt
          grep -q "versionName='11.5-R10'" apk-info.txt
          mkdir -p artifacts
          cp "$APK" artifacts/traslados-conductor-mosaico-r10-prueba.apk
          cp signing.txt apk-info.txt artifacts/
          (cd artifacts && sha256sum *.apk > CONDUCTOR-R10-SHA256SUMS.txt)
          echo "$GITHUB_SHA" > artifacts/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Conductor-Mosaic-R10-Firmado
          path: artifacts/
          retention-days: 30
      - name: Publish only on draft feature branch
        run: |
          set -euo pipefail
          git config user.name "Traslados Draft CI"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin feature/mapa-driver-mosaico-modular-20261016
            git reset --hard origin/feature/mapa-driver-mosaico-modular-20261016
            mkdir -p preview-artifacts
            cp artifacts/traslados-conductor-mosaico-r10-prueba.apk preview-artifacts/
            cp artifacts/CONDUCTOR-R10-SHA256SUMS.txt preview-artifacts/CONDUCTOR-R10-SHA256SUMS.txt
            git add preview-artifacts/traslados-conductor-mosaico-r10-prueba.apk preview-artifacts/CONDUCTOR-R10-SHA256SUMS.txt
            git diff --cached --quiet && exit 0
            git commit -m "APK Conductor mosaic R10 firmada en rama borrador"
            if git push origin HEAD:feature/mapa-driver-mosaico-modular-20261016; then exit 0; fi
          done
          exit 1
