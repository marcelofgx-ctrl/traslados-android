# ACTUALIZADO: 2026-10-01
# VERSION: build-v10.7-final-cliente-conductor
# BASES: Cliente v9.0 + Conductor v9.2

name: Build Traslados v10.7 FINAL - Cliente y Conductor

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v10.7-final.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android base and current v9 packages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/c059c89bac5a5ebb423176af474134a289f88418/.github/workflows/build-apks.yml" -o /tmp/base-v4.yml
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/d819c60656fe1934be9d6aa31eefdea7beb041be/.github/workflows/build-apks.yml" -o /tmp/cliente-v9.yml
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/d819c60656fe1934be9d6aa31eefdea7beb041be/.github/workflows/build-conductor.yml" -o /tmp/conductor-v9.2.yml

          python3 - <<'PYRESTORE'
          import base64, io, re, tarfile
          from pathlib import Path

          base = Path('/tmp/base-v4.yml').read_text(encoding='utf-8')
          m = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| tar -xz", base)
          if not m:
              raise SystemExit('No se encontró el proyecto Android base')
          data = base64.b64decode(m.group(1), validate=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tf:
              tf.extractall('.')

          def overlay(path, label):
              txt = Path(path).read_text(encoding='utf-8')
              m = re.search(r"payload\s*=\s*\(([\s\S]*?)\n\s*\)", txt)
              if not m:
                  raise SystemExit(f'No se encontró payload de {label}')
              pieces = re.findall(r'"([A-Za-z0-9+/=]+)"', m.group(1))
              if not pieces:
                  raise SystemExit(f'Payload vacío de {label}')
              raw = base64.b64decode(''.join(pieces), validate=True)
              with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tf:
                  tf.extractall('.')
              print(label, len(raw), 'bytes')

          overlay('/tmp/cliente-v9.yml', 'Cliente v9.0')
          overlay('/tmp/conductor-v9.2.yml', 'Conductor v9.2')
          PYRESTORE

          grep -q "versionName '9.0'" cliente/build.gradle
          grep -q "versionName '9.2'" conductor/build.gradle
          echo "Bases v9 restauradas correctamente"

