name: Publicar descarga directa de Mapa QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-mapa-qa-download.yml'

permissions:
  contents: write
  actions: read

jobs:
  public-qa-asset:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener APK YA compilada y verificada
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qa
          gh run download 39525385001 \
            --repo "$GITHUB_REPOSITORY" \
            --name quicktrip-mapa-conductor-unificado-qa \
            --dir qa
          cd qa
          sha256sum --check SHA256SUMS.txt
          test -s QuickTrip-Mapa-Conductor-Unificado-QA.apk
          echo "APK autentificada por SHA256"
      - name: Publicar nueva APK en release QA existente, sin sobreescribir la anterior
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_TAG: qa-mapa-unificado-20261020-r39476812976
        run: |
          set -euo pipefail
          # La release QA ya existe; no crear nuevas releases con permisos limitados.
          gh release view "$QA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          cp qa/QuickTrip-Mapa-Conductor-Unificado-QA.apk \
             qa/QuickTrip-Mapa-Panel-Conductor-Corregido-QA.apk
          gh release upload "$QA_TAG" qa/QuickTrip-Mapa-Panel-Conductor-Corregido-QA.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "### Mapa + panel Conductor corregido - APK QA exacta de compilación #39525385001" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$QA_TAG/QuickTrip-Mapa-Panel-Conductor-Corregido-QA.apk" >> "$GITHUB_STEP_SUMMARY"
