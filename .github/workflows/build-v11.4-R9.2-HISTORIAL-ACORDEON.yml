# ACTUALIZADO: 2026-10-02
# VERSION: v11.4 R9.2 — Historial desplegable premium del Conductor
# ALCANCE: SOLO UI/UX de Historial.
# NO MODIFICA: backend, Supabase, GPS, telemetría, alertas, sonidos, Manifest ni lógica de reservas.
# BASE EXACTA: R9.1 compilada con éxito, run 37068850223.

name: Build Traslados Conductor v11.4 R9.2 - Historial Acordeon

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v11.4-R9.2-HISTORIAL-ACORDEON.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android base and Conductor v9.2 package
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/c059c89bac5a5ebb423176af474134a289f88418/.github/workflows/build-apks.yml" -o /tmp/base-v4.yml
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/d819c60656fe1934be9d6aa31eefdea7beb041be/.github/workflows/build-conductor.yml" -o /tmp/conductor-v9.2.yml

          python3 - <<'PYRESTORE'
          import base64, io, re, tarfile
          from pathlib import Path

          base=Path('/tmp/base-v4.yml').read_text(encoding='utf-8')
          m=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| tar -xz",base)
          if not m:
              raise SystemExit('No se encontró el proyecto Android base')
          raw=base64.b64decode(m.group(1),validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              tf.extractall('.')

          txt=Path('/tmp/conductor-v9.2.yml').read_text(encoding='utf-8')
          m=re.search(r"payload\s*=\s*\(([\s\S]*?)\n\s*\)",txt)
          if not m:
              raise SystemExit('No se encontró payload de Conductor v9.2')
          pieces=re.findall(r'"([A-Za-z0-9+/=]+)"',m.group(1))
          if not pieces:
              raise SystemExit('Payload vacío de Conductor v9.2')
          raw=base64.b64decode(''.join(pieces),validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              tf.extractall('.')
          print('Base + Conductor v9.2 restaurados')
          PYRESTORE

          test -f conductor/build.gradle
          grep -q "versionName '9.2'" conductor/build.gradle

      - name: Download exact successful R9.1 patched source
        uses: actions/download-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-R9.1-HISTORIAL-patched-source
          path: /tmp/r91src
          github-token: ${{ github.token }}
          repository: marcelofgx-ctrl/traslados-android
          run-id: 37068850223

      - name: Overlay exact R9.1 Conductor source
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/r91src/java/uy/com/traslados/conductor/MainActivity.java
          test -f /tmp/r91src/java/uy/com/traslados/conductor/Api.java
          test -f /tmp/r91src/java/uy/com/traslados/conductor/ReservationMonitorService.java
          test -f /tmp/r91src/java/uy/com/traslados/conductor/TripTelemetryService.java
          test -f /tmp/r91src/AndroidManifest.xml
          mkdir -p conductor/src/main
          cp -a /tmp/r91src/. conductor/src/main/
          echo "Fuente exacta R9.1 superpuesta"

      - name: Protect stable R9.1 backend alerts GPS and assets
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            conductor/src/main/java/uy/com/traslados/conductor/Api.java \
            conductor/src/main/java/uy/com/traslados/conductor/ReservationMonitorService.java \
            conductor/src/main/java/uy/com/traslados/conductor/TripTelemetryService.java \
            conductor/src/main/AndroidManifest.xml \
            conductor/src/main/res/raw/reserva_calida.wav \
            conductor/src/main/res/raw/viaje_proximo.wav \
            > /tmp/r91-protected.sha256
          cat /tmp/r91-protected.sha256

      - name: Apply R9.2 premium history accordion
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_r92_history.py
          python3 /tmp/patch_r92_history.py

          D=conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
          grep -q 'historyExpandedDay' "$D"
          grep -q 'AutoTransition' "$D"
          grep -q 'historyDayHeader(String day,int count,boolean open)' "$D"
          grep -q '▴' "$D"
          grep -q '▾' "$D"
          grep -q 'Conductor v11.4 R9.2 iniciado' "$D"
          echo "R9.2 Historial acordeón aplicado"

      - name: Verify stable R9.1 source was not touched
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/r91-protected.sha256
          echo "Backend, alertas, GPS, sonidos y Manifest siguen byte a byte como R9.1"

      - name: Set Conductor version 11.4-R9.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERSION'
          from pathlib import Path
          import re

          p=Path('conductor/build.gradle')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s+\d+','versionCode 119',s,count=1)
          s,n2=re.subn(r"versionName\s+'[^']+'","versionName '11.4-R9.2'",s,count=1)
          if n1!=1 or n2!=1:
              raise SystemExit(f'No se pudo fijar versión: code={n1}, name={n2}')
          p.write_text(s,encoding='utf-8')
          PYVERSION

      - name: Verify R9.2 source
        shell: bash
        run: |
          set -euo pipefail
          D=conductor/src/main/java/uy/com/traslados/conductor

          grep -q "versionCode 119" conductor/build.gradle
          grep -q "versionName '11.4-R9.2'" conductor/build.gradle

          grep -q 'https://zetaudvvutlouiqxopvg.supabase.co' "$D/Api.java"
          grep -q 'driver_check_route_fit_v11_4' "$D/Api.java"
          grep -q 'driverNewReservationCueOnce' "$D/ReservationMonitorService.java"
          grep -q 'traslados_nuevas_v114_r9_visual' "$D/ReservationMonitorService.java"
          grep -q 'traslados_proximo_v114_r9_visual' "$D/ReservationMonitorService.java"
          grep -q 'TripTelemetryService' "$D/MainActivity.java"
          grep -q 'GPS LISTO' "$D/MainActivity.java"
          grep -q 'WindowInsets.Type.ime()' "$D/MainActivity.java"

          grep -q 'historyExpandedDay' "$D/MainActivity.java"
          grep -q 'historyExpandedDay==null' "$D/MainActivity.java"
          grep -q 'selectedDay.equals(historyExpandedDay)' "$D/MainActivity.java"
          grep -q 'AutoTransition' "$D/MainActivity.java"
          grep -q 'transition.setDuration(180)' "$D/MainActivity.java"
          grep -q 'historyDayHeader(String day,int count,boolean open)' "$D/MainActivity.java"
          grep -q 'setIncludeFontPadding(false)' "$D/MainActivity.java"
          grep -q 'Conductor v11.4 R9.2 iniciado' "$D/MainActivity.java"
          grep -q 'v11.4 R9.2' "$D/MainActivity.java"

          test -s conductor/src/main/res/raw/reserva_calida.wav
          test -s conductor/src/main/res/raw/viaje_proximo.wav
          echo "R9.2 source checks OK"

      - name: Upload R9.2 patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-R9.2-HISTORIAL-ACORDEON-patched-source
          path: |
            conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
            conductor/src/main/java/uy/com/traslados/conductor/Api.java
            conductor/src/main/java/uy/com/traslados/conductor/ReservationMonitorService.java
            conductor/src/main/java/uy/com/traslados/conductor/TripTelemetryService.java
            conductor/src/main/AndroidManifest.xml
            conductor/src/main/res/raw/reserva_calida.wav
            conductor/src/main/res/raw/viaje_proximo.wav
          if-no-files-found: error

      - name: Build Conductor v11.4 R9.2
        run: gradle :conductor:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor_v11.4_R9.2_HISTORIAL_ACORDEON.apk
          sha256sum artifacts/Traslados_Conductor_v11.4_R9.2_HISTORIAL_ACORDEON.apk | tee artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: Upload Conductor R9.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-R9.2-HISTORIAL-ACORDEON
          path: |
            artifacts/Traslados_Conductor_v11.4_R9.2_HISTORIAL_ACORDEON.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
