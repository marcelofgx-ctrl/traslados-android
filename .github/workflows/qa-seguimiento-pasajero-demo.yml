name: Quick Trip · APK seguimiento QA simulado
on:
  push:
    branches: [qa/seguimiento-pasajero-demo-20261026]
    paths:
      - 'qa/seguimiento-pasajero-demo/**'
      - '.github/workflows/qa-seguimiento-pasajero-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build_demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar aislamiento y sintaxis
        shell: bash
        run: |
          set -euo pipefail
          test -f qa/seguimiento-pasajero-demo/app/src/main/assets/tracking.html
          grep -q 'QA · SIMULACIÓN' qa/seguimiento-pasajero-demo/app/src/main/assets/tracking.html
          grep -q "uy.quicktrip.seguimiento.qa" qa/seguimiento-pasajero-demo/app/build.gradle
          grep -q 'No recibe tu GPS' qa/seguimiento-pasajero-demo/app/src/main/assets/tracking.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('qa/seguimiento-pasajero-demo/app/src/main/assets/tracking.html').read_text()
          Path('/tmp/demo-quicktrip.js').write_text(s.split('<script>')[1].split('</script>')[0])
          PY
          node --check /tmp/demo-quicktrip.js
      - name: Compilar APK debug sin credenciales ni release signing
        run: cd qa/seguimiento-pasajero-demo && gradle --no-daemon :app:assembleDebug
      - name: Validar APK aislada
        shell: bash
        run: |
          set -euo pipefail
          test -s qa/seguimiento-pasajero-demo/app/build/outputs/apk/debug/app-debug.apk
          sha256sum qa/seguimiento-pasajero-demo/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QuickTrip-Seguimiento-Pasajero-QA-SIMULADO
          path: qa/seguimiento-pasajero-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
