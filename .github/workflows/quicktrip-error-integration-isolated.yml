name: Quick Trip 23505 Client Error Integration QA (NO APK / NO DEPLOY)
on:
  push:
    branches:
      - feat/quicktrip-23505-ui-errors-isolated-20261024
permissions:
  contents: read
jobs:
  isolated-client-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Strict scope - exactly 3 error handling paths + 2 tests + docs + QA workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base='200ee63eb127a0b882e9b4aba20837d077a6142a'
          changed=set(subprocess.check_output(['git','diff','--name-only',base+'...HEAD'],text=True).splitlines())
          allowed={
            'conductor/src/main/java/uy/com/traslados/conductor/Api.java',
            'web-pasajero/rpc-client.js',
            'web-pasajero/app.js',
            'qa/quicktrip-capacity/error-23505/test_pwa_contract.cjs',
            'qa/quicktrip-capacity/error-23505/test_android_existing.cjs',
            'qa/quicktrip-capacity/error-23505/README.md',
            '.github/workflows/quicktrip-error-integration-isolated.yml',
          }
          assert changed==allowed, 'scope violation: '+str(sorted(changed^allowed))
          print('PASS SCOPE: ONLY Android message mapper, PWA error transport+UI, 2 tests, QA docs+CI')
          PY
      - name: Check JavaScript source parse only (no build, no deployment)
        shell: bash
        run: |
          set -euo pipefail
          node --check web-pasajero/app.js
          node --check web-pasajero/rpc-client.js
          node --check qa/quicktrip-capacity/error-23505/test_pwa_contract.cjs
          node --check qa/quicktrip-capacity/error-23505/test_android_existing.cjs
          echo 'PASS JS: syntax valid, no PWA build or publish'
      - name: Run actual PWA transport/UI with fake PostgREST 409 and 14 regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          node qa/quicktrip-capacity/error-23505/test_pwa_contract.cjs
      - name: Run standalone Android Java reference and shared fixtures (no APK)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qt-error-classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/qt-error-classes" \
            qa/quicktrip-capacity/error-23505/CapacityErrorContract.java \
            qa/quicktrip-capacity/error-23505/CapacityErrorContractTest.java
          java -cp "$RUNNER_TEMP/qt-error-classes" qt.qa.errors.CapacityErrorContractTest \
            qa/quicktrip-capacity/error-23505/cases.tsv
      - name: Compile/exercise actual Android publicMessage in JDK-only fake harness
        shell: bash
        run: |
          set -euo pipefail
          node qa/quicktrip-capacity/error-23505/test_android_existing.cjs
      - name: QA only - state no deployment
        shell: bash
        run: |
          echo 'PASS = error handling updated ONLY in an isolated branch; no APK, Supabase, merge or PWA deployment.' >> "$GITHUB_STEP_SUMMARY"
