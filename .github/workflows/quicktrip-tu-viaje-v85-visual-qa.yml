name: Quick Trip PWA v85 - Tu Viaje compacto QA (SIN DEPLOY)
on:
  push:
    branches:
      - qa/quicktrip-tu-viaje-compacto-v85-20261024
    paths:
      - .github/workflows/quicktrip-tu-viaje-v85-visual-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact-passenger-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Proteger motores y comprobar diff acotado respecto a v84
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base='89e87b91d8c662c76ea02dbcaac46225daed1b6f'
          changes=set(subprocess.check_output(
            ['git','diff','--name-only',base+'..HEAD'],text=True).splitlines())
          allowed={
            'web-pasajero/quicktrip-clean.css',
            'web-pasajero/index.html',
            'web-pasajero/sw.js',
            'web-pasajero/tests/quicktrip-mobile-skin-v83-smoke.cjs',
            'web-pasajero/tests/quicktrip-tu-viaje-compacto-v85-visual-qa.cjs',
            '.github/workflows/quicktrip-tu-viaje-v85-visual-qa.yml',
          }
          assert changes==allowed,('Fuera de alcance',sorted(changes-allowed),
            'Ausentes',sorted(allowed-changes))
          print('PASS: solo diseño, cache, pruebas y CI; sin motores')
          PY
          git diff --quiet 89e87b91d8c662c76ea02dbcaac46225daed1b6f..HEAD -- \
            web-pasajero/app.js web-pasajero/service-home.js \
            web-pasajero/booking-contracts.js web-pasajero/rpc-client.js \
            web-pasajero/geo-search.js web-pasajero/address-engine.js \
            web-pasajero/route-engine.js web-pasajero/eta-engine.js \
            web-pasajero/reservation-live.js web-pasajero/premium-map.js \
            web-pasajero/quicktrip-clean.js mapatrayectos conductor supabase migrations
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar contratos de los tres servicios y capa compacta
        shell: bash
        run: |
          set -euo pipefail
          node web-pasajero/tests/quicktrip-three-services-v84-smoke.cjs
          node web-pasajero/tests/quicktrip-mobile-skin-v83-smoke.cjs
          node web-pasajero/tests/service-home-v61-smoke.cjs
          node --check web-pasajero/tests/quicktrip-tu-viaje-compacto-v85-visual-qa.cjs
          node --check web-pasajero/quicktrip-clean.js
      - name: Chromium real para QA sin acceso a backend
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH" || { echo "No disponible Chromium"; exit 1; }
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --prefix /tmp/quicktrip-web-v85 --no-save --no-audit --no-fund playwright-core@1.56.1
          echo "NODE_PATH=/tmp/quicktrip-web-v85/node_modules" >> "$GITHUB_ENV"
      - name: Capturas reales móviles con formulario nativo
        shell: bash
        env:
          QA_DIR: ${{ github.workspace }}/quicktrip-web-v85-capturas
        run: |
          set -euo pipefail
          node web-pasajero/tests/quicktrip-tu-viaje-compacto-v85-visual-qa.cjs
      - name: Comparar navegación de portada y tres servicios v84
        shell: bash
        env:
          QA_DIR: ${{ github.workspace }}/quicktrip-web-v85-regresiones
        run: |
          set -euo pipefail
          node web-pasajero/tests/quicktrip-three-services-visual-qa.cjs
      - name: Adjuntar capturas y mediciones; NO publicar GitHub Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuickTrip-Tu-Viaje-v85-Capturas-Reales-QA-NoPublicadas
          path: |
            quicktrip-web-v85-capturas/
            quicktrip-web-v85-regresiones/
          if-no-files-found: warn
          retention-days: 14
