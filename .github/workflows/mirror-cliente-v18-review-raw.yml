name: Mirror Cliente v18 signed review APK direct mobile download
on:
  push:
    branches: [feature/cliente-seguimiento-integrado-20261017]
    paths: ['.github/workflows/mirror-cliente-v18-review-raw.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror-cliente-v18-signed
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download latest SIGNED v18 from verified Github Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILE=Traslados_Cliente_v18_Seguimiento_Integrado_REVIEW.apk
          mkdir -p /tmp/cliente-v18-signed
          gh release download cliente-v18-seguimiento-integrado-review-20261017 -p "$FILE" -p SHA256SUMS.txt -D /tmp/cliente-v18-signed
          (cd /tmp/cliente-v18-signed && sha256sum -c SHA256SUMS.txt)
          test "$(stat -c %s /tmp/cliente-v18-signed/$FILE)" -gt 100000
      - name: Place in review branch only, do NOT touch official passenger downloads
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=feature/cliente-seguimiento-integrado-20261017
          FILE=Traslados_Cliente_v18_Seguimiento_Integrado_REVIEW.apk
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p preview-artifacts
          cp "/tmp/cliente-v18-signed/$FILE" preview-artifacts/
          (cd preview-artifacts && sha256sum "$FILE" > CLIENTE-V18-SHA256SUMS.txt && sha256sum -c CLIENTE-V18-SHA256SUMS.txt)
          git config user.name 'Traslados QA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add "preview-artifacts/$FILE" preview-artifacts/CLIENTE-V18-SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa: mirror latest signed Cliente v18 APK for direct Samsung download [skip ci]'
          git push origin "HEAD:$BRANCH"
