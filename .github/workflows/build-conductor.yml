      - name: Fix missing Uri import
        shell: bash
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('conductor/src/main/java/uy/com/traslados/conductor/ReservationMonitorService.java')
          s = p.read_text(encoding='utf-8')
          if 'import android.net.Uri;' not in s:
              if 'import android.media.RingtoneManager;' in s:
                  s = s.replace('import android.media.RingtoneManager;', 'import android.media.RingtoneManager;\nimport android.net.Uri;')
              else:
                  s = s.replace('package uy.com.traslados.conductor;', 'package uy.com.traslados.conductor;\n\nimport android.net.Uri;')
              p.write_text(s, encoding='utf-8')
          PYFIX

      - name: Build Conductor v9.0
        run: gradle :conductor:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor_v9.0.apk
          ls -lh artifacts/Traslados_Conductor_v9.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v9.0
          path: artifacts/Traslados_Conductor_v9.0.apk
          if-no-files-found: error
