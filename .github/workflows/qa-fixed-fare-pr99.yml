name: QA PR99 fixed fare passenger and Conductor
on:
  push:
    branches: [feature/tu-viaje-premium-visual-20261015]
    paths:
      - '.github/workflows/qa-fixed-fare-pr99.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, all passenger smoke tests, and fixed fare workflow contracts
