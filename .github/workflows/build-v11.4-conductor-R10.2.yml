# ACTUALIZADO: 2026-10-03
# VERSION: Traslados Conductor v11.4 R10.2 - refinamiento visual chevrons
# BASE: fuente exacta R10.1 exitosa (run 37092874002)

name: Build Traslados Conductor v11.4 R10.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v11.4-conductor-R10.2.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android base and Conductor v9.2 package
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/c059c89bac5a5ebb423176af474134a289f88418/.github/workflows/build-apks.yml" -o /tmp/base-v4.yml
          curl -fsSL "https://raw.githubusercontent.com/marcelofgx-ctrl/traslados-android/d819c60656fe1934be9d6aa31eefdea7beb041be/.github/workflows/build-conductor.yml" -o /tmp/conductor-v9.2.yml

          python3 - <<'PYRESTORE'
          import base64, io, re, tarfile
          from pathlib import Path

          base=Path('/tmp/base-v4.yml').read_text(encoding='utf-8')
          m=re.search(r"echo '([A-Za-z0-9+/=]+)' \\| base64 -d \\| tar -xz",base)
          if not m:
              raise SystemExit('No se encontró proyecto Android base')
          raw=base64.b64decode(m.group(1),validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              tf.extractall('.')

          txt=Path('/tmp/conductor-v9.2.yml').read_text(encoding='utf-8')
          m=re.search(r"payload\\s*=\\s*\\(([\\s\\S]*?)\\n\\s*\\)",txt)
          if not m:
              raise SystemExit('No se encontró payload Conductor v9.2')
          pieces=re.findall(r'"([A-Za-z0-9+/=]+)"',m.group(1))
          if not pieces:
              raise SystemExit('Payload vacío Conductor v9.2')
          raw=base64.b64decode(''.join(pieces),validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              tf.extractall('.')
          print('Conductor v9.2 restaurado',len(raw),'bytes')
          PYRESTORE

          test -d conductor
          grep -q "versionName '9.2'" conductor/build.gradle

      - name: Download exact successful R10.1 patched source
        uses: actions/download-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-R10.1-patched-source
          path: /tmp/r101src
          github-token: ${{ github.token }}
          repository: marcelofgx-ctrl/traslados-android
          run-id: 37092874002

      - name: Overlay exact R10.1 Conductor source
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/r101src/src/main/java/uy/com/traslados/conductor/MainActivity.java
          cp -a /tmp/r101src/. conductor/
          grep -q "versionName '11.4-R10.1'" conductor/build.gradle
          grep -q 'Conductor v11.4 R10.1 iniciado' conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java

      - name: Download exact R10.1 APK for audio resources
        uses: actions/download-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-R10.1
          path: /tmp/r101apk
          github-token: ${{ github.token }}
          repository: marcelofgx-ctrl/traslados-android
          run-id: 37092874002

      - name: Restore R10.1 audio resources
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/r101apk -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p conductor/src/main/res/raw /tmp/r101raw
          unzip -j -o "$APK" 'res/raw/reserva_calida.wav' 'res/raw/viaje_proximo.wav' -d /tmp/r101raw
          cp /tmp/r101raw/reserva_calida.wav conductor/src/main/res/raw/reserva_calida.wav
          cp /tmp/r101raw/viaje_proximo.wav conductor/src/main/res/raw/viaje_proximo.wav
          test -s conductor/src/main/res/raw/reserva_calida.wav
          test -s conductor/src/main/res/raw/viaje_proximo.wav

      - name: Apply R10.2 premium disclosure indicators
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYR102'
          from pathlib import Path

          p=Path('conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java')
          s=p.read_text(encoding='utf-8')

          old='''    private View chevronView(final boolean expanded,final boolean prominent){
              View v=new View(this){private final Paint paint=new Paint(Paint.ANTI_ALIAS_FLAG);@Override protected void onDraw(Canvas canvas){super.onDraw(canvas);paint.setStyle(Paint.Style.STROKE);paint.setStrokeCap(Paint.Cap.ROUND);paint.setStrokeJoin(Paint.Join.ROUND);paint.setStrokeWidth(dp(2));paint.setColor(prominent?GOLD:TEXT);float cx=getWidth()/2f,cy=getHeight()/2f,dx=dp(prominent?8:7),dy=dp(prominent?5:4);Path path=new Path();path.moveTo(cx-dx,cy-dy);path.lineTo(cx,cy+dy);path.lineTo(cx+dx,cy-dy);canvas.drawPath(path,paint);}};
              v.setRotation(expanded?0f:-90f);v.setAlpha(.96f);v.setImportantForAccessibility(View.IMPORTANT_FOR_ACCESSIBILITY_YES);return v;
          }
          '''

          new='''    // R10.2: indicador de expansión premium. No usa caracteres tipográficos:
              // dibuja un badge sutil y un chevron fino, con geometría distinta para día y reserva.
              private View chevronView(final boolean expanded,final boolean prominent){
                  View v=new View(this){
                      private final Paint fill=new Paint(Paint.ANTI_ALIAS_FLAG);
                      private final Paint stroke=new Paint(Paint.ANTI_ALIAS_FLAG);
                      @Override protected void onDraw(Canvas canvas){
                          super.onDraw(canvas);
                          float cx=getWidth()/2f,cy=getHeight()/2f;
                          int badge=dp(prominent?36:32);
                          float left=cx-badge/2f,top=cy-badge/2f,right=cx+badge/2f,bottom=cy+badge/2f;
                          RectF r=new RectF(left,top,right,bottom);

                          fill.setStyle(Paint.Style.FILL);
                          fill.setColor(prominent?Color.argb(24,224,193,111):Color.argb(12,238,244,246));
                          canvas.drawRoundRect(r,badge/2f,badge/2f,fill);

                          stroke.setStyle(Paint.Style.STROKE);
                          stroke.setStrokeCap(Paint.Cap.ROUND);
                          stroke.setStrokeJoin(Paint.Join.ROUND);
                          stroke.setStrokeWidth(dp(1));
                          stroke.setColor(prominent?Color.argb(138,224,193,111):Color.argb(62,238,244,246));
                          canvas.drawRoundRect(new RectF(left+.5f,top+.5f,right-.5f,bottom-.5f),badge/2f,badge/2f,stroke);

                          stroke.setStrokeWidth(prominent?dp(2):dp(1));
                          stroke.setColor(prominent?GOLD:Color.rgb(231,238,240));
                          int dx=dp(prominent?6:5),dy=dp(prominent?4:3);
                          Path path=new Path();
                          if(expanded){
                              path.moveTo(cx-dx,cy-dy/2f);
                              path.lineTo(cx,cy+dy);
                              path.lineTo(cx+dx,cy-dy/2f);
                          }else{
                              path.moveTo(cx-dy/2f,cy-dx);
                              path.lineTo(cx+dy,cy);
                              path.lineTo(cx-dy/2f,cy+dx);
                          }
                          canvas.drawPath(path,stroke);
                      }
                  };
                  v.setAlpha(.98f);
                  v.setImportantForAccessibility(View.IMPORTANT_FOR_ACCESSIBILITY_YES);
                  return v;
              }
          '''

          if old not in s:
              raise SystemExit('No encontré chevronView exacto de R10.1')
          s=s.replace(old,new,1)

          # Refinar el espacio reservado: el badge se ve intencional, no como una gran flecha suelta.
          s=s.replace('LinearLayout.LayoutParams ap=new LinearLayout.LayoutParams(dp(52),dp(48));ap.setMargins(dp(6),0,0,0);row.addView(arrow,ap);',
                      'LinearLayout.LayoutParams ap=new LinearLayout.LayoutParams(dp(46),dp(46));ap.setMargins(dp(7),0,0,0);row.addView(arrow,ap);',1)
          s=s.replace('LinearLayout.LayoutParams ap=new LinearLayout.LayoutParams(dp(50),dp(48));ap.setMargins(dp(5),0,0,0);top.addView(arrow,ap);',
                      'LinearLayout.LayoutParams ap=new LinearLayout.LayoutParams(dp(42),dp(42));ap.setMargins(dp(6),0,0,0);top.addView(arrow,ap);',1)

          s=s.replace('Conductor v11.4 R10.1 iniciado','Conductor v11.4 R10.2 iniciado')
          s=s.replace('Traslados Conductor · v11.4 R10.1','Traslados Conductor · v11.4 R10.2')
          s=s.replace('v11.4 R10.1','v11.4 R10.2')
          p.write_text(s,encoding='utf-8')

          api=Path('conductor/src/main/java/uy/com/traslados/conductor/Api.java')
          a=api.read_text(encoding='utf-8').replace('11.4-R10.1','11.4-R10.2')
          api.write_text(a,encoding='utf-8')
          print('R10.2 premium chevrons applied')
          PYR102

      - name: Set Conductor v11.4 R10.2 version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERSION'
          from pathlib import Path
          import re
          p=Path('conductor/build.gradle')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 120',s,count=1)
          s=re.sub(r"versionName\s+'[^']+'","versionName '11.4-R10.2'",s,count=1)
          p.write_text(s,encoding='utf-8')
          PYVERSION

      - name: Verify R10.2 source
        shell: bash
        run: |
          set -euo pipefail
          D=conductor/src/main/java/uy/com/traslados/conductor
          grep -q "versionCode 120" conductor/build.gradle
          grep -q "versionName '11.4-R10.2'" conductor/build.gradle
          grep -q '11.4-R10.2' "$D/Api.java"
          grep -q 'Conductor v11.4 R10.2 iniciado' "$D/MainActivity.java"
          grep -q 'indicador de expansión premium' "$D/MainActivity.java"
          grep -q 'canvas.drawRoundRect' "$D/MainActivity.java"
          grep -q 'collapseAllOtherDays' "$D/MainActivity.java"
          grep -q 'WindowInsets' "$D/MainActivity.java"
          grep -q 'TripTelemetryService' "$D/MainActivity.java"
          grep -q 'driverNewReservationCueOnce' "$D/ReservationMonitorService.java"
          grep -q 'traslados_nuevas_v114_r9_visual' "$D/ReservationMonitorService.java"
          ! grep -q 'new AlertDialog.Builder' "$D/MainActivity.java"
          test -s conductor/src/main/res/raw/reserva_calida.wav
          test -s conductor/src/main/res/raw/viaje_proximo.wav
          echo "R10.2 source checks OK"

      - name: Upload R10.2 patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-R10.2-patched-source
          path: |
            conductor/build.gradle
            conductor/src/main/AndroidManifest.xml
            conductor/src/main/java/uy/com/traslados/conductor/MainActivity.java
            conductor/src/main/java/uy/com/traslados/conductor/Api.java
            conductor/src/main/java/uy/com/traslados/conductor/ReservationMonitorService.java
            conductor/src/main/java/uy/com/traslados/conductor/TripTelemetryService.java
          if-no-files-found: error

      - name: Build Traslados Conductor v11.4 R10.2
        run: gradle :conductor:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp conductor/build/outputs/apk/debug/conductor-debug.apk artifacts/Traslados_Conductor_v11.4_R10.2.apk
          sha256sum artifacts/Traslados_Conductor_v11.4_R10.2.apk
          ls -lh artifacts/Traslados_Conductor_v11.4_R10.2.apk

      - name: Upload Traslados Conductor v11.4 R10.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Traslados-Conductor-v11.4-R10.2
          path: artifacts/Traslados_Conductor_v11.4_R10.2.apk
          if-no-files-found: error
