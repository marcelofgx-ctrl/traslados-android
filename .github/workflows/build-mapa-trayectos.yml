      - name: Build signed release
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/traslados-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: traslados-conductor
          ANDROID_KEY_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: gradle :mapatrayectos:assembleRelease --stacktrace 2>&1 | tee mapa-trayectos-build.log

      - name: Verify native Conductor integration inside Mapa
        shell: bash
        run: |
          set -euo pipefail
          BASE=mapatrayectos/build/generated/embeddedConductor
          test -s "$BASE/java/uy/com/traslados/conductor/MainActivity.java"
          test -s "$BASE/java/uy/com/traslados/conductor/Api.java"
          test -s "$BASE/java/uy/com/traslados/conductor/ReservationMonitorService.java"
          test -s "$BASE/java/uy/com/traslados/conductor/TripTelemetryService.java"
          test -s "$BASE/res/raw/reserva_calida.wav"
          test -s "$BASE/res/raw/viaje_proximo.wav"
          test -s "$BASE/res/drawable-nodpi/conductor_app_icon.png"
          grep -q 'TransferAlerts.reportNew' "$BASE/java/uy/com/traslados/conductor/ReservationMonitorService.java"
          echo "Integrated Conductor Java screens, RPC, monitor, WAV and GPS services verified"

      - name: Verify packaged original reminder sound
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find mapatrayectos/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -s "$APK"
          APK="$APK" python3 - <<'PY'
          import hashlib, os, zipfile
          expected="5cc7d452cb5f265bf6544486c52f3e8b57d3a292e77af38cbb5e3df0e9875bb0"
          apk=os.environ["APK"]
          with zipfile.ZipFile(apk) as z:
              media=[info for info in z.infolist()
                     if info.file_size==33062 or info.filename.lower().endswith(".mp3")]
              print("Packaged MP3 candidates:",[(x.filename,x.file_size) for x in media])
              for info in media:
                  data=z.read(info)
                  if hashlib.sha256(data).hexdigest()==expected:
                      print("Verified original 33062-byte MP3 inside signed candidate APK:",info.filename)
                      break
              else:
                  raise SystemExit("MP3 original not found with expected SHA256 in APK")
          PY

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find mapatrayectos/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing.txt
          grep -qi 'Verified' signing.txt
          ACTUAL="$(grep -i 'certificate SHA-256 digest' signing.txt | head -1 | sed 's/^.*: //' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = 'd91f4b9a37f4c77653fdf18fe792e7011a046dd2c09fded1e13fd29d4267269d'

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find mapatrayectos/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          cp "$APK" artifacts/Mapa_Trayectos_v0.1_R25_9_RELEASE.apk
          sha256sum artifacts/Mapa_Trayectos_v0.1_R25_9_RELEASE.apk | tee artifacts/SHA256SUMS.txt
          cp signing.txt artifacts/SIGNING.txt
          cp sound-status.txt artifacts/SOUND_STATUS.txt
          printf '\nR23.1: bubble even without journey; GPS off while idle 2.04 s reminder MP3 embedded; original SHA256 5cc7d452cb5f265bf6544486c52f3e8b57d3a292e77af38cbb5e3df0e9875bb0\n' >> artifacts/SOUND_STATUS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mapa-Trayectos-v0.1-R25-9-RELEASE
          path: |
            artifacts/Mapa_Trayectos_v0.1_R25_9_RELEASE.apk
            artifacts/SHA256SUMS.txt
            artifacts/SIGNING.txt
            artifacts/SOUND_STATUS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publicar APK Mapa firmado en descarga directa sin Play Store
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-pasajero/downloads
          # Publish the new upgrade under a NEW immutable filename.
          # Never replace R24.8/R24.9 previously installed by drivers.
          (cd web-pasajero/downloads && sha256sum -c MAPA-R24.8-SHA256SUMS.txt)
          (cd web-pasajero/downloads && sha256sum -c MAPA-R24.9-SHA256SUMS.txt)
          cp artifacts/Mapa_Trayectos_v0.1_R25_9_RELEASE.apk \
            web-pasajero/downloads/mapa-trayectos-r25.9.apk
          (cd web-pasajero/downloads && sha256sum mapa-trayectos-r25.9.apk > MAPA-R25.9-SHA256SUMS.txt)
          (cd web-pasajero/downloads && sha256sum -c MAPA-R25.9-SHA256SUMS.txt)
          git config user.name "Traslados Release CI"
          git config user.email "actions@users.noreply.github.com"
          git add web-pasajero/downloads/mapa-trayectos-r25.9.apk \
                  web-pasajero/downloads/MAPA-R25.9-SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'APK Mapa R25.9 ya publicada sin alterar binario'
            exit 0
          fi
          git commit -m 'Publicar Mapa Trayectos R25.9 APK firmada'
          for retry in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Error de publicación; conservar artifact firmado del run'
          exit 1
