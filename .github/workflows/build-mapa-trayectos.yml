name: Build Mapa Trayectos RELEASE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mapatrayectos/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-mapa-trayectos.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TRASLADOS_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/traslados-release.jks"
          test -s "$RUNNER_TEMP/traslados-release.jks"

      - name: Verify Mapa Trayectos source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'uy.com.mapatrayectos'" mapatrayectos/build.gradle
          grep -q "versionName '0.1-R19'" mapatrayectos/build.gradle
          grep -q "versionCode 22" mapatrayectos/build.gradle
          grep -q 'c.drawText("1/2 PARADA"' mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "vibrateDualHalfStop" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "vibrateDualFinish" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "SHEET_MID_DP=276" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "DB_VERSION = 4" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackDb.java
          grep -q "ACTION_PICKUP_PASSENGER" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q "ACTION_START_STOP" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q "PARADAS REGISTRADAS" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "setOnMidpointCompleted" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "AudioTrack" mapatrayectos/src/main/java/uy/com/mapatrayectos/FeedbackReceiver.java
          grep -q "setOnApplyWindowInsetsListener" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "roundedGradient" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "SPEED_STALE_DISPLAY_MS=3500L" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q "STATIONARY_GHOST_KMH=13.0f" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q "expireStaleMotion" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q "ROUTE_GLOW_LAYER" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "https://tiles.openfreemap.org/styles/liberty" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "START_SOURCE" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "END_SOURCE" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "cameraBearing" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "iconRotationAlignment" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "13.60f" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "class CompassView" mapatrayectos/src/main/java/uy/com/mapatrayectos/CompassView.java
          grep -q "history-glow" mapatrayectos/src/main/java/uy/com/mapatrayectos/TripDetailActivity.java
          test "$(grep -o 'new LineLayer("history-casing"' mapatrayectos/src/main/java/uy/com/mapatrayectos/TripDetailActivity.java | wc -l)" -eq 1
          test "$(grep -o 'new LineLayer("history-glow"' mapatrayectos/src/main/java/uy/com/mapatrayectos/TripDetailActivity.java | wc -l)" -eq 1
          grep -q "dashboard_sheet_state_r13" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "showMaintenanceMenu" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "ACTION_CREATE_DOCUMENT" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "ACTION_OPEN_DOCUMENT" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "class DatabaseBackup" mapatrayectos/src/main/java/uy/com/mapatrayectos/DatabaseBackup.java
          grep -q "wal_checkpoint" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackDb.java
          grep -q "AGRUPADO POR DÍA" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "30 días" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "CANCELADO" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "Todos contraídos" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "HISTORIAL DE TRAYECTOS" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "expandedDay=null" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "new Intent(this,HistoryActivity.class)" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "class TexturedDrawable" mapatrayectos/src/main/java/uy/com/mapatrayectos/TexturedDrawable.java
          grep -q "premiumGradient(Color.rgb(4,48,57)" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "maxSheetState" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "BUBBLE_SHOW_DELAY_MS=320L" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q "signalTrackingUi(true)" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "signalTrackingUi(true)" mapatrayectos/src/main/java/uy/com/mapatrayectos/TripDetailActivity.java
          grep -q "https://tiles.openfreemap.org/styles/liberty" mapatrayectos/src/main/java/uy/com/mapatrayectos/TripDetailActivity.java
          grep -q "class HistoryBottomSheet" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryBottomSheet.java
          grep -q "HISTORIAL DE TRAYECTOS" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryBottomSheet.java
          grep -q "expandedDay=null" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryBottomSheet.java
          grep -q "toggleHistoryPanel" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "HISTORY_MID_DP=360" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "bottomSheet.setVisibility(View.GONE)" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "SHEET_PEEK_DP=34" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "sheet_shift_close" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "headerGradient" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "statusPillGradient" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "sheetStartHeight" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "animateSheetHeight" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "head.setOnTouchListener(this::onSheetTouch)" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "updateSheetContentVisibility" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "WindowInsets.Type.navigationBars" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "onSheetTouch" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "panelGradient" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "start-halo" mapatrayectos/src/main/java/uy/com/mapatrayectos/TripDetailActivity.java
          grep -q "end-halo" mapatrayectos/src/main/java/uy/com/mapatrayectos/TripDetailActivity.java
          grep -q "SYSTEM_ALERT_WINDOW" mapatrayectos/src/main/AndroidManifest.xml
          grep -q "trip_type" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackDb.java
          grep -q "amount_uyu" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackDb.java
          grep -q "class TripFlowDialogs" mapatrayectos/src/main/java/uy/com/mapatrayectos/TripFlowDialogs.java
          grep -q "class FeedbackReceiver" mapatrayectos/src/main/java/uy/com/mapatrayectos/FeedbackReceiver.java
          grep -q "playChime" mapatrayectos/src/main/java/uy/com/mapatrayectos/FeedbackReceiver.java
          grep -q "FLAG_KEEP_SCREEN_ON" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "class TelemetryQuality" mapatrayectos/src/main/java/uy/com/mapatrayectos/TelemetryQuality.java
          grep -q "DB_VERSION = 4" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackDb.java
          grep -q "start_address" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackDb.java
          grep -q "class AddressResolver" mapatrayectos/src/main/java/uy/com/mapatrayectos/AddressResolver.java
          grep -q "google.navigation:q=" mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "JORNADA " mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "Uber " mapatrayectos/src/main/java/uy/com/mapatrayectos/HistoryActivity.java
          grep -q "RETURN_SOURCE" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "lineOffset(2.2f)" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "clearActiveRoute" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "history-return-line" mapatrayectos/src/main/java/uy/com/mapatrayectos/TripDetailActivity.java
          grep -q "start_lat" mapatrayectos/src/main/java/uy/com/mapatrayectos/Api.java
          grep -q "MIN_IMPORT_DB_VERSION=2" mapatrayectos/src/main/java/uy/com/mapatrayectos/DatabaseBackup.java
          grep -q "org.maplibre.gl:android-sdk" mapatrayectos/build.gradle

      - name: Build signed release
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/traslados-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: traslados-conductor
          ANDROID_KEY_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: gradle :mapatrayectos:assembleRelease --stacktrace 2>&1 | tee mapa-trayectos-build.log

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find mapatrayectos/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing.txt
          grep -qi 'Verified' signing.txt

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find mapatrayectos/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          cp "$APK" artifacts/Mapa_Trayectos_v0.1_R19_RELEASE.apk
          sha256sum artifacts/Mapa_Trayectos_v0.1_R19_RELEASE.apk | tee artifacts/SHA256SUMS.txt
          cp signing.txt artifacts/SIGNING.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mapa-Trayectos-v0.1-R19-RELEASE
          path: |
            artifacts/Mapa_Trayectos_v0.1_R19_RELEASE.apk
            artifacts/SHA256SUMS.txt
            artifacts/SIGNING.txt
          if-no-files-found: error
          retention-days: 90
