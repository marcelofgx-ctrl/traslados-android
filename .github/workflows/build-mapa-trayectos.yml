name: Build Mapa Trayectos RELEASE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mapatrayectos/**'
      - 'core-reservations/**'
      - 'conductor/src/**' # Shared Conductor sources are embedded into Mapa
      - 'conductor/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-mapa-trayectos.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install approved Option C contact logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mapatrayectos/src/main/res/drawable-nodpi
          base64 --decode mapatrayectos/assets/logo_c_avatar.jpg.base64 > mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg
          echo "a71f22c701189b3f0ef90a5405a285246e3d8ab80ffe2a528e01b19273737c15  mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg" | sha256sum --check
          file mapatrayectos/src/main/res/drawable-nodpi/logo_c.jpg

      - name: Decode exact uploaded ElevenLabs reminder MP3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mapatrayectos/src/main/res/raw
          base64 --decode mapatrayectos/assets/reminder_bubbles_elevenlabs.mp3.base64 > mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3
          echo "5cc7d452cb5f265bf6544486c52f3e8b57d3a292e77af38cbb5e3df0e9875bb0  mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3" | sha256sum --check
          test "$(stat -c %s mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3)" -eq 33062
          file mapatrayectos/src/main/res/raw/reminder_bubbles_elevenlabs.mp3

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: User-original MP3 support (no Pixabay requests)
        shell: bash
        run: |
          set -euo pipefail
          echo "13 user-original MP3 recordings available in supplemental R22.2 ZIP; SHA-256 guarded local import, no Pixabay dependency." > sound-status.txt
          grep -q "SoundPack.play" mapatrayectos/src/main/java/uy/com/mapatrayectos/FeedbackReceiver.java
          grep -q 'sound_ui_action' mapatrayectos/src/main/java/uy/com/mapatrayectos/SoundPack.java
          grep -q 'hasFullPack' mapatrayectos/src/main/java/uy/com/mapatrayectos/SoundPack.java
          grep -q 'SHIFT_PAUSE' mapatrayectos/src/main/java/uy/com/mapatrayectos/FeedbackReceiver.java
          grep -q 'SHIFT_RESUME' mapatrayectos/src/main/java/uy/com/mapatrayectos/FeedbackReceiver.java
          grep -q 'showSoundPackMenu' mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q 'playUiCue' mapatrayectos/src/main/java/uy/com/mapatrayectos/QuickActionsMenu.java
          grep -q "REQ_IMPORT_SOUNDS" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "MessageDigest" mapatrayectos/src/main/java/uy/com/mapatrayectos/SoundPack.java

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TRASLADOS_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TRASLADOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/traslados-release.jks"
          test -s "$RUNNER_TEMP/traslados-release.jks"

      - name: Verify Mapa Trayectos source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'uy.com.mapatrayectos'" mapatrayectos/build.gradle
          grep -q "versionName '0.1-R25.9'" mapatrayectos/build.gradle
          grep -q "versionCode 61" mapatrayectos/build.gradle
          grep -q "class MetricIconView" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "brand.setOnLongClickListener" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "mapCloseRequested" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q 'PopupWindow(menu,menuWidth,-2,true)' mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q 'dp(49)' mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q 'FrameLayout bubble=new FrameLayout' mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q 'new WindowManager.LayoutParams(size,size' mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q 'postDelayed(longPress,800L)' mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q 'BubbleClosePolicy.mayClose' mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q 'TransferAlerts.ensureMonitor(this)' mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q 'window_x' mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
          grep -q "prepareEmbeddedConductor" mapatrayectos/build.gradle
          grep -q "new Intent(this,uy.com.traslados.conductor.MainActivity.class)" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "showMainMenu" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "showPickupPresenceDialog" mapatrayectos/src/main/java/uy/com/mapatrayectos/MainActivity.java
          grep -q "mapa_presence_ping_v1" mapatrayectos/src/main/java/uy/com/mapatrayectos/Api.java
          grep -q "ACTION_PRESENCE_SYNC" mapatrayectos/src/main/java/uy/com/mapatrayectos/TrackingService.java
