name: QA QuickTrip P1.1 Pickup ETA Return (NO RELEASE)
on:
  push:
    branches:
      - qa/quicktrip-p11-eta-reentry-clean-20261030
    paths:
      - '.github/workflows/qa-quicktrip-p11-eta-return-20261030.yml'
      - 'web-pasajero/app.js'
      - 'web-pasajero/index.html'
      - 'web-pasajero/sw.js'
      - 'web-pasajero/quicktrip-p1-photo1.css'
      - 'tests/quicktrip-p11-baseline-regression.cjs'
      - 'tests/quicktrip-p11-photo1-contract.cjs'
      - 'scripts/qa_quicktrip_p11_return.cjs'
      - 'docs/QA_QUICKTRIP_P11_RETURN_20261030.md'
permissions:
  contents: read
jobs:
  reentry-pickup-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Strict changed-file allowlist and preserve original core
        shell: bash
        run: |
          set -euo pipefail
          BASE=d5f4066a7be73b4863e8d97a664b892043c42704
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          mapfile -t files < <(git diff --name-only "$BASE"..HEAD | LC_ALL=C sort)
          test "${#files[@]}" -eq 9
          for f in "${files[@]}"; do
            case "$f" in
              .github/workflows/qa-quicktrip-p11-eta-return-20261030.yml|docs/QA_QUICKTRIP_P11_RETURN_20261030.md|scripts/qa_quicktrip_p11_return.cjs|tests/quicktrip-p11-baseline-regression.cjs|tests/quicktrip-p11-photo1-contract.cjs|web-pasajero/app.js|web-pasajero/index.html|web-pasajero/sw.js|web-pasajero/quicktrip-p1-photo1.css) ;;
              *) echo "UNAUTHORIZED source change $f";exit 1 ;;
            esac
          done
          git diff --quiet "$BASE"..HEAD -- \
            supabase/ mapatrayectos/ conductor/ \
            web-pasajero/eta-engine.js web-pasajero/pickup-cadence.js \
            web-pasajero/pickup-observability.js web-pasajero/pickup-origin-drift.js \
            web-pasajero/route-engine.js web-pasajero/premium-route.js \
            web-pasajero/reservation-live.js web-pasajero/premium-map.js \
            web-pasajero/quicktrip-clean.js web-pasajero/booking-contracts.js \
            web-pasajero/quicktrip-map-focus.js
          echo 'PASS: ETA/GPS/route/price and reservation engines unchanged'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check web-pasajero/app.js
          node --check tests/quicktrip-p11-baseline-regression.cjs
          node --check tests/quicktrip-p11-photo1-contract.cjs
          node --check scripts/qa_quicktrip_p11_return.cjs
      - name: Preserve existing single flow and P1 photo contracts
        run: |
          set -euo pipefail
          node tests/quicktrip-p11-baseline-regression.cjs
          node tests/quicktrip-p11-photo1-contract.cjs
      - name: Run actual route, fixed price, ETA and GPS origin pure regressions
        run: |
          set -euo pipefail
          node web-pasajero/tests/route-engine-smoke.cjs
          node tests/quicktrip-p1-fixedfare-pure.cjs
          node web-pasajero/tests/eta-engine-smoke.cjs
          node tests/quicktrip-p1-cadence-pure.cjs
          node web-pasajero/tests/pickup-origin-drift-smoke.cjs
      - name: Chromium 390x844 QA UI cycle, synthetic GPS/ETA only
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          node scripts/qa_quicktrip_p11_return.cjs
      - name: Upload QA screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuickTrip-P11-ETA-Reentry-Clean-QA-Samsung-390
          path: artifacts/quicktrip-p11-return/
          retention-days: 21
          if-no-files-found: warn
