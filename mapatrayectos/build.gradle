plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'traslados-conductor'
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: releaseStorePassword
def hasReleaseSigning = releaseKeystorePath && releaseStorePassword

android {
    namespace 'uy.com.mapatrayectos'
    compileSdk 35

    defaultConfig {
        applicationId 'uy.com.mapatrayectos'
        minSdk 26
        targetSdk 35
        versionCode 45
        versionName '0.1-R24.3'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.maplibre.gl:android-sdk:13.6.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.zxing:core:3.5.3'
}


// R24.0: compile the existing Traslados Conductor functionality INSIDE Mapa Trayectos.
// Keep the conductor/ module untouched so its standalone APK remains a usable backup.
// Android application modules have a different generated R package, so transform only
// R imports and resource aliases in generated sources (never in source control).
def embeddedConductorJavaDir = file("$buildDir/generated/embeddedConductor/java")
def embeddedConductorResDir  = file("$buildDir/generated/embeddedConductor/res")
android.sourceSets.main.java.srcDir embeddedConductorJavaDir
android.sourceSets.main.res.srcDir embeddedConductorResDir

tasks.register('prepareEmbeddedConductor') {
    def conductorRoot = file('../conductor/src/main')
    inputs.dir file('../conductor/src/main/java')
    inputs.dir file('../conductor/src/main/res')
    outputs.dir embeddedConductorJavaDir
    outputs.dir embeddedConductorResDir
    doLast {
        delete embeddedConductorJavaDir, embeddedConductorResDir
        def srcRoot = file('../conductor/src/main/java')
        fileTree(srcRoot).matching { include '**/*.java' }.each { original ->
            def rel = srcRoot.toPath().relativize(original.toPath()).toString()
            def dest = new File(embeddedConductorJavaDir, rel)
            dest.parentFile.mkdirs()
            def java = original.getText('UTF-8')
            java = java.replace('package uy.com.traslados.conductor;',
                'package uy.com.traslados.conductor;\nimport uy.com.mapatrayectos.R;')
            java = java.replace('R.drawable.app_icon','R.drawable.conductor_app_icon')
                .replace('R.drawable.bg_texture','R.drawable.conductor_bg_texture')
            if (original.name == 'ReservationMonitorService.java') {
                // The only floating shortcut belongs to Mapa Trayectos.
                // Keep the authenticated reservation monitor, persistent alerts
                // and its existing trip reminders, but disable second free bubble.
                java = java.replace('driverBubbleStartLoop();',
                    '/* R24: Shared Mapa Trayectos bubble owns all floating shortcuts. */')
                java = java.replace('driverBubbleShowIfNeeded();',
                    '{ /* R24: Conductor duplicate overlay disabled. */ }')
                java = java.replace('driverBubbleShowTripCard();',
                    '{ /* R24: Mapa manages floating notifications. */ }')
                java = java.replace('driverBubbleMarkNew(r);',
                    'uy.com.mapatrayectos.TransferAlerts.reportNew(this,r);')
                java = java.replace('JSONArray a=Api.listActive(pin);Set<String> now=new HashSet<>();',
                    'JSONArray a=Api.listActive(pin);uy.com.mapatrayectos.TransferAlerts.updatePending(this,a);Set<String> now=new HashSet<>();')
            }
            if (original.name == 'MainActivity.java') {
                java = java.replace('super.onResume();',
                    'super.onResume();\n        uy.com.mapatrayectos.TransferAlerts.markViewed(this);\n        getSharedPreferences("bubble_state",MODE_PRIVATE).edit().putBoolean("ui_visible",true).apply();\n        try{startService(new Intent(this,uy.com.mapatrayectos.TrackingService.class).setAction(uy.com.mapatrayectos.TrackingService.ACTION_UI_VISIBLE));}catch(Exception ignored){}')
                java = java.replace('super.onPause();',
                    'super.onPause();\n        getSharedPreferences("bubble_state",MODE_PRIVATE).edit().putBoolean("ui_visible",false).apply();\n        try{Intent svc=new Intent(this,uy.com.mapatrayectos.TrackingService.class).setAction(uy.com.mapatrayectos.TrackingService.ACTION_UI_HIDDEN);boolean active=getSharedPreferences("tracking_state",MODE_PRIVATE).getBoolean("shift_active",false);if(active)startService(svc);else if(android.provider.Settings.canDrawOverlays(this)){if(Build.VERSION.SDK_INT>=26)startForegroundService(svc);else startService(svc);}}catch(Exception ignored){}')
            }
            dest.setText(java,'UTF-8')
        }

        def resRoot = file('../conductor/src/main/res')
        ['drawable','raw'].each { type ->
            copy {
                from new File(resRoot,type)
                include '**/*'
                into new File(embeddedConductorResDir,type)
            }
        }
        copy {
            from new File(resRoot,'drawable-nodpi')
            include 'app_icon.png'
            rename 'app_icon.png','conductor_app_icon.png'
            into new File(embeddedConductorResDir,'drawable-nodpi')
        }
        copy {
            from new File(resRoot,'drawable-nodpi')
            include 'bg_texture.png'
            rename 'bg_texture.png','conductor_bg_texture.png'
            into new File(embeddedConductorResDir,'drawable-nodpi')
        }
    }
}
tasks.named('preBuild') { dependsOn tasks.named('prepareEmbeddedConductor') }
