plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'traslados-conductor'
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: releaseStorePassword
def hasReleaseSigning = releaseKeystorePath && releaseStorePassword

android {
    namespace 'uy.com.mapatrayectos'
    compileSdk 35

    defaultConfig {
        applicationId 'uy.com.mapatrayectos'
        minSdk 26
        targetSdk 35
        versionCode 26
        versionName '0.1-R21.2'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.maplibre.gl:android-sdk:13.6.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.zxing:core:3.5.3'
}
