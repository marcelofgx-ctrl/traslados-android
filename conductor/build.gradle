plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'traslados-conductor'
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: releaseStorePassword
def hasReleaseSigning = releaseKeystorePath && releaseStorePassword

// Only CI packaging opts into a unique, side-by-side QA application ID.
// NEVER rename production packages, change engines or remove phone data.
def qaInstallId = (System.getenv('QUICKTRIP_QA_INSTALL_ID') ?: '').toLowerCase(java.util.Locale.ROOT)
if (qaInstallId && !(qaInstallId ==~ /r[0-9]+/))
    throw new GradleException('QUICKTRIP_QA_INSTALL_ID must be r + numeric GitHub run ID')

android {
    namespace 'uy.com.traslados.conductor'
    compileSdk 35

    defaultConfig {
        applicationId 'uy.com.traslados.conductor'
        minSdk 26
        targetSdk 35
        versionCode 130
        versionName '11.5-R8'
        manifestPlaceholders = [quickTripAppLabel: 'Traslados Conductor']
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (qaInstallId) {
                // A new test APK can always install alongside a production build,
                // regardless of old signing keys or app version codes.
                applicationIdSuffix ".qa.${qaInstallId}"
                versionNameSuffix "-QA-${qaInstallId}"
                manifestPlaceholders = [quickTripAppLabel: 'Conductor QA']
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.maplibre.gl:android-sdk:13.6.1'
}
